# FUSB302BMPX - onsemi programmable USB Type-C controller with USB PD BMC PHY, I2C address 0x22, WQFN-14 2.5 x 2.5 mm
# (case 510BR, MLP-14, 0.5 mm pitch, exposed pad)
# Sources: FUSB302B/D Rev. 5 (August 2021), PDF p. 2 (Table 1 ordering information), p. 5 (Figure 5 pin
# assignment, top-through and bottom views; Table 3 pin description), p. 18 (Table 15 I2C slave address),
# p. 31 (case 510BR outline and recommended land pattern, drawing 98AON13629G, issue O, 31 Aug 2016)
# (PDF page numbers of the cached fusb302b-d.pdf). Land pattern read from a 200 dpi render of p. 31.

[part]
mpn = "FUSB302BMPX"
manufacturer = "onsemi"
library = "onsemi"
symbol = "FUSB302BMPX"
reference = "U"
description = "Programmable USB Type-C controller with USB PD BMC physical layer, I2C address 0x22, source/sink/DRP, dead-battery Rd, WQFN-14 (MLP) 2.5 x 2.5 mm, 0.5 mm pitch"
keywords = "USB Type-C PD power delivery port controller TCPM CC FUSB302 FUSB302B WQFN MLP"
datasheet = "https://www.onsemi.com/pdf/datasheet/fusb302b-d.pdf"
datasheet_rev = "FUSB302B/D Rev. 5"
notes = [
  "FUSB302BMPX: top mark UA, 7-bit I2C address 0x22 (FUSB302B/D p. 2 Table 1, p. 18 Table 15). Same die, package and pins as FUSB302B01MPX, which differs only in the address: both files keep an identical [footprint] section (one land, case 510BR).",
  "Land pattern = onsemi recommended land pattern, case 510BR (FUSB302B/D p. 31, 98AON13629G): 14 pads 0.30 TYP wide x (0.58) long at 0.50 TYP pitch; 2.43 between the centre lines of opposite pad rows (the dimension lines end on the red pad centre lines, in both axes); centre pad 1.45 x 1.45. Pad corners are drawn square. Note D: 'land pattern recommendation is existing industry land pattern'.",
  "Pin order (p. 5, Figure 5, top-through view): 1-3 left top to bottom (CC2, VBUS, VDD), 4-7 bottom left to right (VDD, INT_N, SCL, SDA), 8-10 right bottom to top (GND, GND, CC1), 11-14 top right to left (CC1, VCONN, VCONN, CC2).",
  "The exposed pad has no number in the datasheet ('Connect to GND for thermal', p. 5): it is pad 15 here, named GND; the sheet lists it as 'EP' with no name (sheet_number, sheet_name).",
  "Solder mask and stencil openings are not given by onsemi: UNVERIFIED. The centre pad prints at full pad size (generator default); a reduced, windowed aperture is a board-level stencil decision.",
  "Pin types from Table 3: CC1/CC2 I/O (bidirectional), VBUS input, VDD power, VCONN power-switch input (power_in), SCL input, SDA open-drain I/O (bidirectional), INT_N open-drain output (open_collector).",
]

