# NSC5083D-22.5792M: NDK NZ2520SDA crystal clock oscillator, specification number NSC5083D (+3.3 V +/- 0.33 V,
# +/-50e-6, -40 to +85 C), 22.5792 MHz. Four terminals, 2.5 x 2.0 x 0.9 mm max.
# Source: NDK catalogue c_NZ2520SDA_e.pdf (2 pages; p. 1 code 2012E_NZ2520SDA_e, p. 2 code 1703A_NZ2520SDA_e),
# sha256 b818c72b...7825 per manifest. Cited as "NZ2520SDA". Why this catalogue applies: NZ2520SDA is the model and
# NSC5083D its specification number for +3.3 V (NZ2520SDA p. 2, "Specification Number" table: NSC5083A/B/C/D =
# 1.8/2.5/3.0/3.3 V); the order code is model + frequency + specification number (p. 2 note). The parts-lib sheet
# states the same ("NZ2520SDA, specification number NSC5083D").
#
# Drawing reading (NZ2520SDA p. 1, Dimensions, checked on a 400 dpi render):
#   Top view (marking side, pin-1 dot) shows the dot at the LOWER-LEFT corner.
#   The terminal view below it (hatched terminals, #1 terminal chamfered) is a BOTTOM view: #1 upper-left, #2 upper-right,
#   #4 lower-left, #3 lower-right; terminals 0.8 +/- 0.1 x 0.7 +/- 0.1, pitch 1.65 +/- 0.1 (long axis) x 1.25 +/- 0.1.
#   "Land pattern (Recommended)" view: #4 upper-left, #3 upper-right, #1 lower-left, #2 lower-right; lands 1.0 x 1.0 at
#   1.65 x 1.25. This matches the top view (dot lower-left) and is the bottom view flipped about the long axis, so the
#   land-pattern view is a TOP view: #1 lower-left, then counter-clockwise #2, #3, #4. This resolves the sheet's open
#   pin-1 question (the two views are top and bottom views of the same part, not contradictory).
#
# Orientation: the land pattern is rotated 90 deg clockwise (as seen from the top, +y down) so that #1 is top-left
# (schema / IPC-7351 zero orientation): (x, y) -> (-y, x). Long axis (1.65) is now vertical; body 2.0 (x) x 2.5 (y).
#   #1 (-0.625, -0.825)  #4 (0.625, -0.825)
#   #2 (-0.625,  0.825)  #3 (0.625,  0.825)
# Pads: 1.0 x 1.0 rectangles as drawn (no corner radius in the drawing).

