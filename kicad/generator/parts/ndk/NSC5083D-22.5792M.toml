keywords = "oscillator XO crystal clock CMOS NDK NZ2520SDA NSC5083D MCLK audio"
datasheet = "https://www.ndk.com/images/products/catalog/c_NZ2520SDA_e.pdf"
datasheet_rev = "NZ2520SDA catalogue 2012E_NZ2520SDA_e (p. 1) / 1703A_NZ2520SDA_e (p. 2)"
notes = [
  "Pin 1 orientation: the sheet marks it UNVERIFIED because the dimension and land-pattern views are mirrored. Reading of NZ2520SDA p. 1: the hatched-terminal view is a bottom view (terminal #1 chamfered), the land pattern is a top view consistent with the top-view pin-1 dot (lower-left). #1 STAND-BY at the dot corner, counter-clockwise from the top. Worth a check against a real part's marking.",
  "Footprint rotated 90 deg clockwise from the catalogue land-pattern view so that #1 is top-left; body therefore 2.0 (x) x 2.5 (y).",
  "Body height: only 0.9 mm max is given (NZ2520SDA p. 1); the 3D envelope uses the maximum. Nominal height UNVERIFIED.",
  "The catalogue recommends about 0.01 uF between VCC and GND close to the part (Cby in the land-pattern view); not part of the footprint.",
  "Paste: the catalogue gives no stencil; 1:1 apertures (generator default).",
]

