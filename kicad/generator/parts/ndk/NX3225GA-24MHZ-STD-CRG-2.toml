# NX3225GA-24MHZ-STD-CRG-2: NDK NX3225GA crystal unit, 24 MHz, specification number STD-CRG-2 (standard: CL 8 pF,
# +/-20e-6 at 25 C, +/-30e-6 over -40 to +85 C). Four terminals, 3.2 x 2.5 x 0.75 mm.
# Source: NDK sheet 2008E_NX3225GA_e (one page; the copy read carries a Mouser listing as page 2),
# sha256 09de146d...c96e per manifest. Cited as "NX3225GA".
#
# Drawing reading (NX3225GA p. 1, Dimensions, checked on a 200 dpi render):
#   "Terminal land connections (TOP VIEW)": #4 upper-left, #3 upper-right, #1 lower-left (chamfered), #2 lower-right;
#   the crystal between #1 and #3; "#2 and #4 are not connected. It is better to connect with a GND. But NC is also
#   possible."
#   The terminal view below the body (#1 upper-left, #2 upper-right, #4 lower-left, #3 lower-right) is the bottom view.
#   "Land pattern (Recommended)": lands 1.4 (along the 3.2 side) x 1.2, centres 2.2 x 1.6.
#
# Orientation: the top view is rotated 90 deg clockwise (as seen from the top, +y down) so that #1 is top-left
# (schema / IPC-7351 zero orientation): (x, y) -> (-y, x). Long axis now vertical; body 2.5 (x) x 3.2 (y).
#   #1 (-0.8, -1.1)  #4 (0.8, -1.1)
#   #2 (-0.8,  1.1)  #3 (0.8,  1.1)
# Lands 1.2 (x) x 1.4 (y) after rotation.

