# BAT54,215 - Nexperia BAT54 Schottky barrier diode, SOT23 (TO-236AB), packing code ,215
# Sources: Nexperia BAT54 product data sheet v.6 (1 July 2022), p. 2 (Table 2 pinning), p. 6
# (Fig. 5 package outline SOT23), p. 7 (Fig. 6 reflow soldering footprint, sot023_fr).

[part]
mpn = "BAT54,215"
manufacturer = "Nexperia"
library = "nexperia"
symbol = "BAT54"
reference = "D"
description = "Schottky barrier diode, single, 30 V, 200 mA, VF 320 mV max at 1 mA, SOT23 (TO-236AB)"
keywords = "diode Schottky BAT54 SOT23 TO-236AB Nexperia"
datasheet = "https://assets.nexperia.com/documents/data-sheet/BAT54_SER.pdf"
datasheet_rev = "BAT54 v.6 (1 July 2022)"
notes = [
  "Land pattern = Nexperia reflow soldering footprint sot023_fr (Fig. 6, p. 7): solder lands 0.6 (3x) x 0.7 (3x); pins 1 and 2 at 1.9 (basic) pitch, pin 3 centred opposite, 2 (basic) between the rows; paste 0.5 (3x) x 0.6 (3x); solder resist larger than the lands (drawn, not dimensioned: the pads use the board's mask margin).",
  "Fig. 6 does not number the lands; the numbering follows Fig. 5 (p. 6, top view): pins 1 and 2 on one side 1.9 apart, pin 3 opposite and centred.",
  "The copy read is the LCSC mirror of the Nexperia document (sha256 40b7447c...325847); the manifest URL refused the download. ',215' is the packing code; v.6 carries no packing information (UNVERIFIED reel details).",
  "Pin 2 is n.c. (Table 2): a visible no_connect pin (CRAFT-125), so the board can leave it open; its land stays for the package's third lead.",
  "Box symbol: the generator draws rectangular bodies only; A left, K right.",
]

[[pins]]
number = "1"
name = "A"
type = "passive"
side = "left"

[[pins]]
number = "2"
name = "NC"
sheet_name = "n.c."
type = "no_connect"
side = "left"
gap = true

[[pins]]
number = "3"
name = "K"
type = "passive"
side = "right"

[footprint]
name = "Nexperia_SOT23_TO-236AB_2.9x1.3mm_P1.9mm"
description = "Nexperia SOT23 (TO-236AB), 2.9 x 1.3 mm body, 1.9 mm pitch, Nexperia reflow soldering footprint sot023_fr"
tags = "SOT23 SOT-23 TO-236AB Nexperia"
attr = "smd"
courtyard_class = "default"
land_pattern = "manufacturer"
land_pattern_cite = "BAT54 v.6 p. 7, Fig. 6 reflow soldering footprint for SOT23 (sot023_fr)"
body = { x = 2.9, y = 1.3, z = 1.1, standoff = 0.0, cite = "BAT54 v.6 p. 6, Fig. 5: body 2.8-3.0 x 1.2-1.4, height 0.9-1.1" }
body_offset = [0.0, 0.0]

[[footprint.pads]]
number = "1"
at = [-0.95, 1.0]
size = [0.6, 0.7]
shape = "rect"
type = "smd"
paste = false
cite = "Fig. 6: lands 0.6 (3x) x 0.7 (3x); 1.9 between pins 1 and 2; 2 between rows, centred on the body"

[[footprint.pads]]
number = "2"
at = [0.95, 1.0]
size = [0.6, 0.7]
shape = "rect"
type = "smd"
paste = false
cite = "Fig. 6; Fig. 5 pin 2 beside pin 1"

[[footprint.pads]]
number = "3"
at = [0.0, -1.0]
size = [0.6, 0.7]
shape = "rect"
type = "smd"
paste = false
cite = "Fig. 6; Fig. 5 pin 3 opposite, centred"

[[footprint.paste]]
start = [-0.95, 1.0]
count = [2, 1]
pitch = [1.9, 0.0]
size = [0.5, 0.6]
shape = "rect"
cite = "Fig. 6: solder paste 0.5 (3x) x 0.6 (3x) at the land centres"

[[footprint.paste]]
start = [0.0, -1.0]
count = [1, 1]
pitch = [0.0, 0.0]
size = [0.5, 0.6]
shape = "rect"
cite = "Fig. 6: solder paste on pin 3"

[[checks]]
kind = "dx"
a = "1"
b = "2"
value = 1.9
cite = "Fig. 6, 1.9 (basic)"

[[checks]]
kind = "dy"
a = "3"
b = "1"
value = 2.0
cite = "Fig. 6, 2 (basic)"

[[checks]]
kind = "pad_size"
a = "1"
value = [0.6, 0.7]
cite = "Fig. 6, 0.6 (3x), 0.7 (3x)"

[[checks]]
kind = "pad_count"
value = 3
cite = "Fig. 5, three leads"
