# Hirose DM3AT-SF-PEJM5: microSD connector, push-push, top board mounting, card-detection switch.
# Primary source: Hirose DM3 Series catalog, edition 2017.1 (May 1, 2017), p. 3 "DM3AT ... Recommended PCB
# mounting pattern" and outline (sha256 b74bee24...5951). Vector drawing, read at 600-700 dpi.
#
# Drawing frame: top view (same orientation as the outline: contacts #1..#8 along the top edge with #1 at
# the right, card inserted from the bottom, detection-switch terminals on the left side).
# x reference: the card-slot centre line CL (note 1). The pattern dimensions are taken from the #1 pad
# centre line, which is 3.2 right of CL ("(3.2)" on the pattern and on the outline).
# y reference: the line at the root of the contact row (the 1.2 contact lands stand above it; 3.7, 9.9,
# 14.05, 14.5 ... measured downward from it). It coincides with the rear edge of the body (outline: body
# 15.95 deep; pattern lands end 15.45 below it, inside the front edge) - coincidence UNVERIFIED by a
# stated dimension, pixel-consistent.
# Body: 13.85 wide with (7.35) from CL to the right edge -> x_cl -6.50 .. +7.35, centre +0.425; depth
# 15.95 -> centre 7.975 below the reference. Footprint x = x_cl - 0.425, y = y_ref - 7.975.
#
# Lands (x_cl, y_ref centre, w x h), all from p. 3:
#   #1..#8      x_cl = 3.2 - 1.1(n-1) (P=1.1, 7.7 span), y_ref -0.6, 0.7 x 1.2
#   B (detect)  x_cl = 3.2 - 8.65 = -5.45, y_ref -0.6, 0.7 ("0.7" upper left) x 1.2
#   S1 top-right x_cl = 3.2 + 1.55 = 4.75, y_ref -0.6, 1.0 ("1") x 1.2
#   left column: x_cl from 3.2 - 9.1 - 1 = -6.9 to -5.9 (widths "1", "9.1"), centre -6.4:
#     S1  y_ref 3.7, h 1.2 ("1.2")
#     A (detect) y_ref 9.9, h 0.8 ("0.8")
#     S1  y_ref 14.05, h 2.8 ("2.8")
#   S1 bottom-right: x_cl from 3.2 + 3.25 = 6.45, w 1.3 -> centre 7.1; y_ref 14.5, h 1.9; plus a foot to
#     the left from x_cl 3.2 + 2.7 = 5.9, from y_ref 15.1 to the land bottom 15.45, with a C0.15 chamfer
#     at the inner corner (chamfer not modelled; foot drawn as a second S1 rectangle overlapping the
#     main land by 0.15 so the copper merges).
# Detect-switch identity: outline leader SWITCH(B) points at the upper-left corner terminal (x_cl about
# -5.5, matches the 0.7 land in the contact row); SWITCH(A) points at the left side about 10.9 below the
# rear edge (matches the 0.8 land at 9.9). The four remaining lands are the shell ground points (p. 1,
# feature 3: "metal cover connects to the board ground at four points").

[part]
mpn = "DM3AT-SF-PEJM5"
second_source = "Molex 104031-0811 (BOM v1 line 11)"
manufacturer = "Hirose"
library = "Hirose"
symbol = "DM3AT-SF-PEJM5"
reference = "J"
description = "microSD card connector, push-push, top board mounting, SMT, normally-open card-detection switch"
keywords = "microSD TF card socket push-push Hirose DM3"
datasheet = "https://www.hirose.com/en/product/series/DM3"
datasheet_rev = "DM3 catalog 2017.1 (May 1, 2017)"
sheet = "Hirose/DM3AT-SF-PEJM5.md"
notes = [
  "Land pattern = manufacturer 'Recommended PCB mounting pattern' (catalog 2017.1 p. 3). Pattern tolerance not stated.",
  "Datasheet URL: manifest has the series page; the copy read is the LCSC mirror (C114218) named in the sheet.",
  "Pad numbers for the switch and shell are not given by Hirose or the sheet: detection switch terminals 'A' and 'B' (the catalog labels), shell lands 'S1' (OpenDAP choice). Spec-sheet gap: the sheet has no explicit pin table for A, B and the shell.",
  "Keep-out areas (note 3, 'no conductive traces', hatched): not encoded in this schema; they must be added to the footprint as rule areas: strip x_cl -6.85..-6.0 from the rear edge to 7.9 MIN; the L-shaped area 8.2/8.9 MIN wide from x_cl about -5.8 to 3.7 between 4.4 MAX and 6 MIN; strip x_cl about -5.8..-5.1 from 5.7 MAX to 13.3 MIN; bottom area x_cl 3.35..5.9 from 14.1 MAX to the land bottom. Positions read from p. 3, review before use.",
  "Bottom-right shell land is L-shaped with a C0.15 chamfer; modelled as two overlapping S1 rectangles (counted twice in pad_count).",
  "y reference = body rear edge: consistent on the drawing (contact lands stand 1.2 beyond it, as the outline's contact tails do) but not stated as such.",
  "Card-detection switch: open without card, closed with card (p. 3 note 2).",
]

