# DF40C-100DS-0.4V(51): Hirose DF40 receptacle, 100 contacts, 0.4 mm pitch, double row, vertical SMT, 1.5 mm stacking
# height, style C (without reinforcing metal fitting). HRS No. 684-4033-4 51. Placed on the FPC ends of the HAT flat cable.
# Source: DF40 cat. = Hirose DF40 Series catalog, May 1, 2020, p. 4, "Receptacle (Stacking height 1.5mm)" and
#   "Recommended PCB layout", left view "DF40C (Without reinforcing metal fitting)" [PDF page 4]. No receptacle drawing in the cache.
#   Read from a 300 dpi render.
# Geometry:
#   Lands 0.2 +/- 0.02 wide at P = 0.4 +/- 0.02; outer edge to edge 3.78 (+0.05/0), inner 2.38 (0/-0.05)
#     -> land length (3.78 - 2.38)/2 = 0.70, land centre y = +/-(3.78 + 2.38)/4 = +/-1.54 (rows 3.08 apart).
#   Span B = 19.6 +/- 0.02 (table, 100 contacts) = 49 x 0.4 -> 50 lands per row; B runs from the first to the last land:
#     DF40C has no hold-down lands (those, 1.2 +/- 0.02 outboard, belong to the DF40B layout on the right of the same figure).
#   1.5 max resist-coating area between rows (note 3): not encoded.
#   Body: A = 22.6 +/- 0.2, 2.88 +/- 0.2 housing width (3.38 +/- 0.2 over leads), D = 1.45 +/- 0.15 height (table).
# Orientation: as drawn (long axis horizontal, triangle mark at the left end); origin at the land-pattern centre.

[part]
mpn = "DF40C-100DS-0.4V(51)"
manufacturer = "Hirose"
library = "Hirose"
symbol = "DF40C-100DS-0.4V(51)"
reference = "J"
description = "DF40 board-to-FPC receptacle, 100 contacts, 0.4 mm pitch, 2 rows, 1.5 mm stack with DF40C-100DP, vertical SMT, no metal fitting"
keywords = "connector board-to-board board-to-FPC receptacle DF40 DF40C 100DS 0.4mm Hirose"
datasheet = "https://www.hirose.com/en/product/document?clcode=&productname=&series=DF40&documenttype=Catalog&lang=en&documentid=en_DF40_CAT"
datasheet_rev = "DF40 catalog 2020-05-01 (p. 4)"
sheet = "Hirose/DF40C-100DS-DP-0.4V.md"
sheet_pins = "none: the sheet lists no per-contact table; contacts numbered 1-100 in the odd/even convention of the footprint (UNVERIFIED against a Hirose numbering), checked by pad_count"
notes = [
  "Contact numbering is not given in the DF40 catalog or in drawing EDC3-311351-00, and the parts-lib sheet has no pin table: UNVERIFIED. The footprint uses the KiCad 2-row convention, odd contacts on the upper row and even on the lower row, 1/2 at the end carrying the moulded triangle mark (left in the catalog/drawing views). Header and receptacle face each other when mated, so pin n on one side does not land on pin n on the other with the same convention: map the nets through the mating, not by number, until Hirose's numbering is confirmed.",
  "Land pattern from the catalog only (DF40 cat. p. 4, DF40C view); no Hirose drawing for the receptacle is cached. Worth checking against the receptacle drawing when obtained.",
  "Resist-coating area 1.5 mm max between the rows (cat. p. 4 note 3) is not encoded in the footprint.",
  "Placed on an FPC: stiffener under the receptacle per the sheet (specification UNVERIFIED).",
]

