# KYOCERA AVX 70-9258-001-120-006: single SMT spring-finger compression contact (9258-100, type 120).
# Primary source: sales drawing 70-9258-001-1X0-00XS Rev F (2025-02-27), sheet 2 of 3 (type 120), from
# 9258-100.zip (sha256 c4907e39...2384). Drawing PDF rendered and read at 300 dpi.
# Footprint frame: top view as drawn on the "PCB LAYOUT" of sheet 2 (fold of the finger toward +x, the
# tapered end of the part outline 0.95 REF beyond the right end of the solder pad).

[part]
mpn = "70-9258-001-120-006"
manufacturer = "KYOCERA AVX"
library = "KYOCERA_AVX"
symbol = "70-9258-001-120-006"
reference = "J"
description = "Single-way SMT spring-finger compression contact, 6 A, 0.4 um gold, deflected height 1.6-2.8 mm (9258-100 type 120)"
keywords = "spring finger compression contact battery contact SMT 9258"
datasheet = "https://datasheets.kyocera-avx.com/9258-100.pdf"
datasheet_rev = "TDS-BTB-0026 Rev 1; drawing 70-9258-001-1X0-00XS Rev F"
sheet = "KYOCERA-AVX/70-9258-001-120-006.md"
sheet_pins = "none: single contact"
notes = [
  "Land pattern = manufacturer PCB layout (sheet 2): one solder pad 7.00 x 2.70 mm; tolerance class .00 = +/-0.10 per title block.",
  "Body = base envelope: 7.8 long (side view), 2.4 wide (top view: the flat base is 2.4 wide; the 1.6/1.3 dimension in the end view is the contact-arm width, max/min), 3.3 high (free height 3.0-3.3, max used as envelope).",
  "Spec-sheet discrepancy: the sheet says '7.8 x 1.6 mm body footprint'; the drawing gives a 2.4 mm wide base (top view, '2.4' and 'phi 2.4 vacuum pick-up area'); 1.6/1.3 is the arm width.",
  "Base position relative to the pad: part outline right end 0.95 REF beyond the pad end (sheet 2); left end 0.15 mm inside the pad's left end is DERIVED (7.00 + 0.95 - 7.8), pixel-checked on the drawing, not a stated dimension.",
  "Mating pad (other part, not in this footprint): gold pad 4.00 x 2.50 mm starting 1.50 mm from the part outline's left end (sheet 2, mating pad layout). Contact point 3.5 REF from the left end in the deflected condition.",
  "Only two checks possible (single pad): pad_size and pad_count.",
]

[[pins]]
number = "1"
name = "CONTACT"
type = "passive"
side = "left"

[footprint]
name = "KYOCERA_AVX_9258-100_70-9258-001-120-006_SpringFinger_Pad7.0x2.7mm"
description = "KYOCERA AVX 70-9258-001-120-006 SMT spring-finger compression contact, 9258-100 type 120, solder pad 7.00 x 2.70 mm (drawing 70-9258-001-1X0-00XS Rev F sheet 2)"
tags = "KYOCERA AVX 9258 spring finger compression contact battery"
attr = "smd"
courtyard_class = "default"
land_pattern = "manufacturer"
land_pattern_cite = "70-9258-001-1X0-00XS Rev F sheet 2, PCB LAYOUT"
