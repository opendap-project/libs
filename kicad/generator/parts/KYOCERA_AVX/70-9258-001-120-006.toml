# the pad centre is at 3.50 -> pad x = 3.50 - 4.05 = -0.55.
body = { x = 7.8, y = 2.4, z = 3.3, standoff = 0.0, cite = "70-9258-001-1X0-00XS Rev F sheet 2: length 7.8 (side view), base width 2.4 (top view), free height 3.0-3.3 (max used)" }
body_offset = [0.0, 0.0]

