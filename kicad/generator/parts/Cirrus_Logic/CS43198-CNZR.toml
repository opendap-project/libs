# CS43198-CNZR audio DAC, 40-pin QFN 5 x 5 mm, 0.4 mm pitch.
# Source: Cirrus Logic DS1156F2 (December 2022). Page numbers are printed page numbers (= PDF page numbers).
# DS1156F2 gives package dimensions (p. 134, Figure 10-1, Table 10-1) but no recommended land pattern, stencil or
# via pattern; §8.4 (p. 121) requires the thermal pad to mate with a matching copper pad, connected to ground,
# with "a series of vias" to inner ground planes (GNDA in split-ground systems). Land pattern DERIVED per IPC-7351B.
#
# Package (Table 10-1, checked against the rendered drawing):
#   D = E = 5 BSC; L = 0.35 / 0.40 / 0.45; b = 0.15 / 0.20 / 0.25; e = 0.4 BSC;
#   J = K (EP) = 3.4 / 3.5 / 3.6; A = 0.7 / 0.75 / 0.8; A1 = 0 / 0.035 / 0.05.
#   10 terminals per side; bottom view shows pin 1 top-right, 10/11 bottom-right, 20/21 bottom-left, 30/31 top-left,
#   i.e. pin 1 top of the left side and counter-clockwise viewed from the top (Figure 1-1, p. 4).
#   Table 10-1 note: "X/Y Dimensions are estimates" (Cirrus wording; UNVERIFIED what it applies to).
#
# IPC-7351B derivation (nominal density). J values as tabulated for IPC-7351B nominal density; UNVERIFIED against the standard text:
#   Jt = 0.30, Jh = 0.00, Js = -0.04; F = 0.05, P = 0.05. D = 5.00 BSC, Ltol = 0 taken.
#   Zmax = 5.00 + 0.60 + 0.0707 = 5.6707 -> 5.67
#   Smin = 5.00 - 0.90 = 4.10; Smax = 5.00 - 0.70 = 4.30; Stol = 0.20; Stol(RMS) = sqrt(2 * 0.10^2) = 0.1414
#   Smax(RMS) = 4.30 - (0.20 - 0.1414)/2 = 4.2707; Gmin = 4.2707 - 0 - sqrt(0.1414^2 + 0.05^2 + 0.05^2) = 4.2707 - 0.1581 = 4.1126 -> 4.11
#   Xmax = 0.15 - 0.08 + sqrt(0.10^2 + 0.05^2 + 0.05^2) = 0.07 + 0.1225 = 0.1925 -> 0.19
#   Pad length (Z - G)/2 = 0.78; pad centre (Z + G)/4 = 2.445; width 0.19. Copper gap 0.21.
#   Inner pad edge 2.055 vs EP edge 1.75: 0.305 clearance. Corner: row end 1.80 + 0.095 = 1.895 < 2.055.
#
# Exposed pad: land = nominal EP 3.5 x 3.5 ("matching copper pad", §8.4 p. 121).
# EP paste: 2 x 2 apertures 1.25 x 1.25 at 1.70 pitch = 6.25 / 12.25 mm^2 = 51 % (OpenDAP choice).
# Vias: 5 (plus pattern) in the 0.45 mm paste-free cross between apertures, drill 0.20, diameter 0.40
#   (OpenDAP choice; §8.4 requires vias but gives no count or size).

[part]
mpn = "CS43198-CNZR"
manufacturer = "Cirrus Logic"
library = "Cirrus_Logic"
symbol = "CS43198-CNZR"
reference = "U"
description = "Stereo 32-bit audio DAC with pseudodifferential headphone-capable outputs, 40-pin QFN 5 x 5 mm, 0.4 mm pitch, exposed pad"
keywords = "audio DAC stereo 32-bit headphone class H CS43198 Cirrus QFN40"
datasheet = "https://www.cirrus.com/docs/ds/cs43198-datasheet.pdf"
datasheet_rev = "DS1156F2"
sheet = "Cirrus-Logic/CS43198-CNZR.md"
notes = [
  "Land pattern derived per IPC-7351B nominal density from DS1156F2 Table 10-1 (p. 134): no recommended land pattern in the datasheet. J values UNVERIFIED against the standard text.",
  "Exposed-pad paste (2 x 2, 1.25 mm at 1.70 mm, 51 %) and the 5-via plus pattern (0.20/0.40 mm) are an OpenDAP choice; DS1156F2 §8.4 (p. 121) only requires a matching copper pad with vias to inner ground planes.",
  "Table 10-1 notes 'X/Y Dimensions are estimates' and describe b as a 'solder sphere diameter' (copied from a WLCSP note): UNVERIFIED how this affects the QFN values.",
  "Pins 28 and 27 carry an overbar in Figure 1-1 (p. 4) (RESET, INT active low); the sheet writes RESET and INT without a bar, so the symbol keeps the sheet names.",
  "Minus signs: the sheet writes FILT−, −VA, VCP_FILT− with U+2212; symbol uses ASCII '-' and sheet_name keeps the sheet text.",
  "EP is passive and named EP (sheet: 'Thermal pad', connect to ground, GNDA in split-ground systems).",
]

