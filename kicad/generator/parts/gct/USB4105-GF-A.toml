# GCT USB4105-GF-A: USB Type-C receptacle for USB 2.0, SMT, PCB top mount.
# Primary source: GCT drawing USB4105 revision B4 (18/12/23), sheet 1 of 2 (sha256 fb331fba...c0e5).
# Rendered and read at 500 dpi. The "Recommended PCB Layout" is "as viewed from component side",
# tolerance +/-0.05; that is the footprint frame used here: signal pads at the top (-y), PCB edge at the
# bottom (+y), mating side toward +y; A1 at top-left.
#
# Distances along y in the drawing are given from the PCB edge (d, toward the pads):
#   rear stake slot centres  d = 2.60          (2x 2.60, PCB edge to slot centre)
#   NPTH locating holes      d = 2.60 + 3.68 = 6.28
#   front stake slot centres d = 2.60 + 4.18 = 6.78   (12x 4.18 ends on the line that is both the pads'
#                                                       lower edge and the front slots' centre line)
#   signal pad centres       d = 6.78 + 1.15/2 = 7.355
# Body: 8.94 x 7.35 footprint outline; side view shows the shell front at the PCB edge (2.60 from the
# front to the rear stake = the layout's 2.60 from the PCB edge), so the body spans d = 0 .. 7.35 and its
# centroid is at d = 3.675. Footprint y = 3.675 - d.

[part]
mpn = "USB4105-GF-A"
second_source = "Amphenol 12402012E212A (BOM v1 line 61)"
manufacturer = "GCT"
library = "GCT"
symbol = "USB4105-GF-A"
reference = "J"
description = "USB Type-C receptacle for USB 2.0, 16 contacts, SMT, PCB top mount, 4 shell stakes, 5 A VBUS"
keywords = "USB Type-C USB2.0 receptacle connector GCT USB4105"
datasheet = "https://gct.co/files/drawings/usb4105.pdf"
datasheet_rev = "Drawing USB4105 rev B4 (18/12/23)"
sheet = "GCT/USB4105-GF-A.md"
notes = [
  "Land pattern = manufacturer 'Recommended PCB Layout' (sheet 1), component-side view, +/-0.05.",
  "Combined GND/VBUS pads (A1/B12, A4/B9, B4/A9, B1/A12) are two pads stacked at the same position, one per pin number (KiCad USB-C practice).",
  "Shell stakes: 4 plated slots, all numbered S1 (sheet pin table 'Shell = GND'; the sheet gives no shell pin number, S1 is an OpenDAP choice). Front pair copper 1.00 x 2.10, drill slot 0.60 x 1.70; rear pair copper 1.00 x 1.80, drill slot 0.60 x 1.40; both pairs 8.64 apart.",
  "Spec-sheet discrepancy: the sheet says 'stake row spacing 8.64 mm (front) and 5.78 mm (rear)'. On the drawing both stake pairs are 8.64 apart (same vertical centre lines); 5.78 is the spacing of the two phi 0.65 NPTH locating holes. The sheet's 'rear slot row 4.18 / front row 2.60/3.68 from the pad row' is also inverted: 2.60 is PCB edge to rear slots, 4.18 rear slots to front slots/pad edge, 3.68 rear slots to NPTH holes.",
  "attr = smd although the shell stakes are plated through slots (mixed part, as KiCad's own USB-C receptacle footprints do); review.",
  "Stake length: -GF-A = default 0.95 mm stake (S +/-0.15, ordering grid); board thickness not decided (parts-lib sheet).",
]

