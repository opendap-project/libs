# TPD8S300ARUKR - TI USB Type-C port protector: 20 V short-to-VBUS protection on CC1/CC2/SBU1/SBU2, IEC ESD on
# eight lines, dead-battery Rd, WQFN-20 (RUK0020B) 3 x 3 mm with exposed pad
# Sources: SLVSEL9 (TPD8S300A datasheet, June 2018), PDF pp. 3-4 (RUK pin configuration, top view, Pin
# Functions); mechanical addendum drawing 4222676/A 02/2016: PDF p. 33 package outline, p. 34 example board
# layout, p. 35 example stencil design (PDF page numbers of the cached tpd8s300a.pdf). Read from 150 dpi renders.

[part]
mpn = "TPD8S300ARUKR"
manufacturer = "Texas Instruments"
library = "texas-instruments"
symbol = "TPD8S300ARUKR"
reference = "U"
description = "USB Type-C port protector, 20 V short-to-VBUS overvoltage protection on CC1, CC2, SBU1, SBU2, 8-channel IEC 61000-4-2 ESD, dead-battery Rd, WQFN-20 (RUK0020B) 3 x 3 mm"
keywords = "USB Type-C protection OVP CC SBU ESD dead battery TPD8S300A WQFN RUK"
datasheet = "https://www.ti.com/lit/ds/symlink/tpd8s300a.pdf"
datasheet_rev = "SLVSEL9"
notes = [
  "Land pattern = TI example board layout RUK0020B (SLVSEL9 p. 34): 20 pads 20X (0.6) x 20X (0.2) at 16X (0.4) pitch, (2.8) between opposite pad-row centres in both axes, (R0.05) TYP; thermal pad 21 (1.7) square. Top view as drawn: pins 1-5 left top to bottom, 6-10 bottom left to right, 11-15 right bottom to top, 16-20 top right to left (the p. 3 pinout is the same order rotated by 90 degrees).",
  "Stencil (p. 35, 0.1 mm): signal apertures equal the pads; pad 21 prints through four 4X (0.75) square apertures at (0.47) TYP from the centre lines, 78 % coverage, so pad 21 has paste = false.",
  "The five optional (0.2) vias in pad 21 (centre and (0.6) TYP from it, note 5) are a layout choice, not part of the footprint.",
  "Non-solder-mask-defined pads, 0.05 mm max opening all around (p. 34): the board default mask expansion applies.",
  "Pin types: the OVP FET pass-through pins (C_CC1/2, CC1/2, C_SBU1/2, SBU1/2), RPD_G1/2 and the ESD clamp lines D1-D4 are passive (I/O in the pin table, no driver); VBIAS (Power, a 0.1 uF capacitor to GND only) is passive; FLT is open drain (open_collector).",
  "Pin 21 is the thermal pad, internally connected to GND; the sheet names it 'Thermal pad' (sheet_name).",
]

