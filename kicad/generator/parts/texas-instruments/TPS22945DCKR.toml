# TPS22945DCKR - TI current-limited load switch, 100-200 mA, auto-restart, active-high ON, DCK0005A (SC-70-5)
# Sources: SLVS832D (TPS2294x datasheet, Nov 2008 rev. July 2014; package addendum 4214834/G 11/2024),
# PDF p. 3 (pin functions), PDF p. 22 (DCK0005A outline), PDF p. 23 (example board layout, scale 18X),
# PDF p. 24 (example stencil design, 0.125 mm stencil).

[part]
mpn = "TPS22945DCKR"
manufacturer = "Texas Instruments"
library = "texas-instruments"
symbol = "TPS22945DCKR"
reference = "U"
description = "Current-limited load switch, 1.62-5.5 V, 0.4 Ohm P-channel, 100-200 mA limit, 10 ms blanking, 80 ms auto-restart, active-high ON, open-drain OC flag, SC-70-5 (DCK0005A)"
keywords = "load switch current limit power switch TPS22945 SC-70 DCK"
datasheet = "https://www.ti.com/lit/ds/symlink/tps22945.pdf"
datasheet_rev = "SLVS832D"
sheet = "texas-instruments/TPS22945DCKR.md"
notes = [
  "Land pattern = TI example board layout DCK0005A (SLVS832D PDF p. 23, drawing 4214834/G): five pads 0.95 x 0.4 mm, 0.65 mm pitch, 2.2 mm between pad-row centres, R0.05 corners; stencil p. 24 equal to the pads (paste = true).",
  "DCK0005A is its own drawing (4214834), not DCK0006A (4214835) minus a pad: the pads are 0.95 mm long instead of 0.9 mm, so this is a separate footprint. Pin 5 sits opposite pin 1 and pin 4 opposite pin 3; there is no pad opposite pin 2.",
  "OC is an open-drain flag that needs a pull-up (p. 9, 8.3.1) -> open_collector.",
]

[[pins]]
number = "5"
name = "VIN"
type = "power_in"
side = "top"

[[pins]]
number = "4"
name = "ON"
type = "input"
side = "left"

[[pins]]
number = "1"
name = "VOUT"
type = "power_out"
side = "right"

[[pins]]
number = "3"
name = "OC"
type = "open_collector"
side = "right"

[[pins]]
number = "2"
name = "GND"
type = "power_in"
side = "bottom"

[footprint]
name = "Texas_DCK0005A_SC-70-5_1.25x2mm_P0.65mm"
description = "Texas Instruments DCK0005A SOT/SC-70-5, 1.25 x 2.0 mm body, 0.65 mm pitch, TI example land pattern (drawing 4214834)"
tags = "SC-70-5 SOT-353 DCK0005A DCK Texas"
datasheet = "https://www.ti.com/lit/ds/symlink/tps22945.pdf"
attr = "smd"
courtyard_class = "default"
land_pattern = "manufacturer"
land_pattern_cite = "DCK0005A example board layout, drawing 4214834/G 11/2024 (SLVS832D PDF p. 23); stencil PDF p. 24"
body = { x = 1.25, y = 2.0, z = 1.1, standoff = 0.0, cite = "DCK0005A outline (SLVS832D PDF p. 22, 4214834/G): body 1.1-1.4 x 1.85-2.15, 1.1 max height, standoff 0.0-0.1" }
body_offset = [0.0, 0.0]

[[footprint.rows]]
first = 1
count = 3
step = 1
start = [-1.1, -0.65]
pitch = [0.0, 0.65]
size = [0.95, 0.4]
shape = "roundrect"
rratio = 0.125
type = "smd"
cite = "DCK0005A example board layout: 5X (0.95) x 5X (0.4), 2X (0.65), (2.2) between pad-row centres, (R0.05) TYP (rratio 0.05/0.4); pins 1-3 left, top to bottom"

[[footprint.rows]]
first = 4
count = 2
step = 1
start = [1.1, 0.65]
pitch = [0.0, -1.3]
size = [0.95, 0.4]
shape = "roundrect"
rratio = 0.125
type = "smd"
cite = "DCK0005A example board layout: pin 4 right row bottom (opposite pin 3), pin 5 right row top (opposite pin 1), (1.3) apart"

