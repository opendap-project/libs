# TPS7A2018PDBVR - TI 300 mA ultra-low-noise LDO, 1.8 V fixed, DBV0005A (SOT-23-5)
# Sources: SBVS338H (TPS7A20 datasheet), p. 4 (Figure 4-4, pin functions), p. 56 (DBV0005A outline,
# drawing 4214839/K 08/2024), p. 57 (example board layout), p. 58 (example stencil design).

[part]
mpn = "TPS7A2018PDBVR"
manufacturer = "Texas Instruments"
library = "Texas_Instruments"
symbol = "TPS7A2018PDBVR"
reference = "U"
description = "LDO regulator, 300 mA, 1.8 V fixed, 7 uVrms noise, 95 dB PSRR at 1 kHz, active output discharge, SOT-23-5 (DBV0005A)"
keywords = "LDO linear regulator low noise TPS7A20 SOT-23-5 DBV"
datasheet = "https://www.ti.com/lit/ds/symlink/tps7a20.pdf"
datasheet_rev = "SBVS338H"
sheet = "Texas-Instruments/TPS7A2018PDBVR.md"
notes = [
  "Land pattern = TI example board layout DBV0005A (SBVS338H p. 57): 5X (1.1) x (0.6) pads, 0.95 mm pitch, (2.6) between pad-row centres, R0.05 corners; non-solder-mask-defined preferred; stencil p. 58 equal to the pads.",
  "The DBV0005A land is identical in TPS7A2018PDBVR.toml and TPS7A2031PDBVR.toml.",
  "Pin 4 is N/C (no internal connection, p. 4): a visible no_connect pin (CRAFT-125).",
]

