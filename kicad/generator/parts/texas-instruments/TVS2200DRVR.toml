# TVS2200DRVR - TI 22 V unidirectional flat-clamp surge protection device, DRV0006A (WSON-6, 2 x 2 mm, exposed pad)
# Sources: SLVSED5C (TVS2200 datasheet, Dec 2017 rev. Aug 2023), PDF p. 3 (Figure 6-1 bottom view, Table 6-1 pin
# functions); mechanical addendum drawing 4222173/C 11/2025: PDF p. 18 package outline, p. 19 example board
# layout, p. 20 example stencil design (PDF page numbers of the cached tvs2200.pdf). Read from 150 dpi renders.

[part]
mpn = "TVS2200DRVR"
manufacturer = "Texas Instruments"
library = "Texas_Instruments"
symbol = "TVS2200DRVR"
reference = "D"
description = "Unidirectional flat-clamp surge protection device, 22 V stand-off, 40 A 8/20 us, IEC 61000-4-2 level 4, WSON-6 (DRV0006A) 2 x 2 mm"
keywords = "TVS surge protection flat clamp ESD VBUS USB-C TVS2200 WSON DRV"
datasheet = "https://www.ti.com/lit/ds/symlink/tvs2200.pdf"
datasheet_rev = "SLVSED5C"
sheet = "Texas-Instruments/TVS2200DRVR.md"
notes = [
  "Land pattern = TI example board layout DRV0006A (SLVSED5C p. 19): six pads 6X (0.45) x 6X (0.3), 4X (0.65) pitch, (1.95) between the pad-column centres, (R0.05) TYP; thermal pad 7 (1) x (1.6). Pins 1-3 left top to bottom, 4-6 right bottom to top (top view; p. 3 shows the bottom view).",
  "Stencil (p. 20, 0.125 mm): signal apertures equal the pads; pad 7 prints through two (1) x (0.7) apertures at y = +/-(0.45), 88 % coverage (2 x 0.7 / 1.6), so pad 7 has paste = false.",
  "The two optional (0.2) vias in pad 7 at y = +/-0.55 ((1.1) apart, note 6) are a layout choice, not part of the footprint.",
  "The DRV0006A land (drawing 4222173/C) is shared with TPS61160DRVR (SLVS791E) and TVS0500DRVR (SLVSED2C carries the same drawing): every one of these data files keeps this [footprint] section identical.",
  "Non-solder-mask-defined pads, 0.07 mm max opening all around (p. 19): the board default mask expansion applies.",
  "Pin 7 is the exposed pad; the sheet lists it as '7 (exposed pad)' (sheet_number).",
]

