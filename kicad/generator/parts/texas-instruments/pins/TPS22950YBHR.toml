# TPS22950YBHR: the datasheet's pin table, transcribed as printed (a second reading for
# test_library.py test_pins_match_datasheet; the symbol's pins come from ../TPS22950YBHR.toml).

datasheet_rev = "SLVSFJ2B"
cite = "SLVSFJ2B PDF p. 4, Table 6-1 (WCSP column)"

[pins]
"A1" = "ON"
"A2" = "FLT"
"B1" = "VIN"
"B2" = "VOUT"
"C1" = "GND"
"C2" = "ILIM"
