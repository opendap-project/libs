# TPD4E05U06DQAR - TI 4-channel 0.5 pF, 5.5 V ESD protection for high-speed lines, USON-10 (DQA0010A) 1 x 2.5 mm
# Sources: SLVSBO7O (TPD1E05U06/TPD4E05U06/TPD6E05U06 datasheet, Dec 2012 rev. Aug 2024), PDF p. 4 (Figure 4-3
# DQA top view, Table 4-2 pin functions); mechanical addendum: DQA0010A drawing 4220328/A 12/2015, PDF p. 28
# package outline, p. 29 example board layout, p. 30 example stencil design; DQA0010B drawing 4230307/A 12/2023,
# PDF pp. 31-33 (PDF page numbers of the cached tpd4e05u06.pdf). Read from 150 dpi renders.

[part]
mpn = "TPD4E05U06DQAR"
manufacturer = "Texas Instruments"
library = "Texas_Instruments"
symbol = "TPD4E05U06DQAR"
reference = "U"
description = "4-channel ESD protection, 0.5 pF, 5.5 V stand-off, IEC 61000-4-2 level 4, flow-through routing, USON-10 (DQA0010A) 1 x 2.5 mm"
keywords = "ESD TVS protection USB high-speed low capacitance TPD4E05U06 USON DQA"
datasheet = "https://www.ti.com/lit/ds/symlink/tpd4e05u06.pdf"
datasheet_rev = "SLVSBO7O"
sheet = "Texas-Instruments/TPD4E05U06DQAR.md"
notes = [
  "Land pattern = TI example board layout DQA0010A (SLVSBO7O p. 29): ten pads 10X (0.565) long, 8X (0.2) wide signal pads and 2X (0.4) wide centre GND pads (3, 8), 4X (0.5) pitch, (0.835) between the column centres, (R0.05) TYP. Pins 1-5 left top to bottom, 6-10 right bottom to top (top view).",
  "Stencil (p. 30, 0.1 mm): apertures equal the signal pads; pads 3 and 8 print 2X (0.36) high x (0.565), 90 % coverage, so they have paste = false and their own apertures.",
  "DQA0010B (drawing 4230307/A, p. 32) has the same ten pads plus a (0.3) bridge with a (0.2) via joining pads 3 and 8 under the package. Both are GND, so a DQA0010B part also solders on this land (its centre bar over solder mask between pads 3 and 8); which outline a reel ships in is UNVERIFIED (sheet).",
  "NC pins 6, 7, 9, 10 are passive, not no_connect: Table 4-2 says they are for optional straight-through routing and may float or be grounded, so a net may legitimately reach them.",
  "Datasheet names use an en dash (D1-, D2- printed as D1–, D2–); the symbol uses ASCII '-'.",
  "Non-solder-mask-defined pads, 0.07 mm max opening all around (p. 29): the board default mask expansion applies.",
]

