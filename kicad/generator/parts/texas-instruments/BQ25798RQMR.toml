# BQ25798RQMR, RQM0029A (VQFN-HR-29, 4 x 4 mm, 0.4 mm pitch, no exposed pad; four L-shaped corner pads).
# Sources: SLUSDV2C p. 4 (Figure 5-1 pinout, top view; Table 5-1), PDF p. 148 (package outline 4225253/A,
# bottom view), PDF p. 149 (example board layout, top view, scale 18X), PDF p. 150 (example stencil design,
# 0.1 mm stencil). Coordinates read from the drawing labels and checked against the PDF vector geometry
# (18X scale, 51.02 pt/mm, origin at the PKG centre lines). Board layout is a top view: pin 1 top-left
# (L-shaped), 1..9 down the left side, 10..15 along the bottom, 16..24 up the right side, 25..29 along the top
# right to left; used as drawn (y down).
# Stencil apertures on PDF p. 150 are 1:1 with the copper pads (same geometry), so pads keep paste = true.

[part]
mpn = "BQ25798RQMR"
second_source = "Texas Instruments BQ25792RQMR (BOM v1 line 39)"
manufacturer = "Texas Instruments"
library = "texas-instruments"
symbol = "BQ25798RQMR"
reference = "U"
description = "I2C-controlled 1-4 cell 5 A buck-boost battery charger with NVDC power path, dual-input selector, MPPT and backup mode, VQFN-HR-29 (RQM) 4 x 4 mm"
keywords = "charger buck-boost NVDC li-ion 2S I2C power path VQFN-HR RQM"
datasheet = "https://www.ti.com/lit/ds/symlink/bq25798.pdf"
datasheet_rev = "SLUSDV2C"
notes = [
  "ACDRV1 and ACDRV2 passive: SLUSDV2C pin table gives them type P, to be tied to GND when no ACFET-RBFET pair is fitted (pp. 4-5, §7.3.5).",
  "Land pattern and stencil are TI's example board layout / stencil for RQM0029A (SLUSDV2C PDF pp. 149-150), used as given.",
  "The four corner pads (pins 1, 9, 16, 24) are L-shaped in the drawing; each is built from two overlapping roundrect pads with the same number (one horizontal leg, one vertical leg). pad_count therefore counts 33 pads (TI labels '33X (0.2)' for the 0.2 mm wide pads and legs).",
  "Right-side pins 17, 18, 19 are longer inward than the other side pads: (0.7), (0.65), (0.68) [0.675 in the vector geometry], centres (1.85), (1.875), (1.8625).",
  "Pin 29 (PMID) is 0.95 mm long, centre (1.725); pins 25-28 are 1.0 mm long, centre (1.7).",
  "Pad corners (R0.05) TYP -> roundrect rratio 0.25 on 0.2 mm wide pads/legs.",
  "Solder mask: non-solder-mask-defined preferred, 0.05 mm max all around (PDF p. 149); generator default mask expansion applies.",
  "Datasheet Figure 5-1 draws INT, CE and QON with an overbar (active low); the pin table (pins/BQ25798RQMR.toml) writes them without a bar, and the symbol keeps those names.",
]

