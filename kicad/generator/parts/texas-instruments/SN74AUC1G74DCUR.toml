pitch = [0.0, 0.5]
size = [0.85, 0.3]
shape = "roundrect"
rratio = 0.17
type = "smd"
cite = "SCES537D p. 15: 8X (0.85), 8X (0.3), 6X (0.5), (3.1) centre to centre, (R0.05) TYP (rratio 0.05/0.3)"

[[footprint.rows]]
