# TPS6286910CRQYR - TI 6 A buck converter with I2C DVS, RQY0009A (VQFN-HR-9, 1.5 x 2.5 mm)
# Sources: SLVSFS3B (TPS62868/TPS62869 datasheet, Sep 2020 rev. Jul 2021), mechanical addendum
# drawing 4225639/A 03/2020: p. 38 package outline, p. 39 example board layout,
# p. 40 example stencil design. Drawings checked against 200 dpi renders.

[part]
mpn = "TPS6286910CRQYR"
second_source = "Texas Instruments TPS628691ARQYR (same land; pin 9 is VSET/VID, 86.6 kOhm to AGND for 0.90 V / 0x41; board ADR 0021)"
manufacturer = "Texas Instruments"
library = "texas-instruments"
symbol = "TPS6286910CRQYR"
reference = "U"
description = "6 A synchronous step-down converter with I2C DVS, 2.4-5.5 V input, 0.4-1.675 V in 5 mV steps, 0.9 V start-up, address 0x42, power good, VQFN-HR-9 (RQY0009A) 1.5 x 2.5 mm"
keywords = "buck step-down converter DC-DC DCS-Control I2C DVS 6A TPS62869 VQFN-HR RQY0009A vdd_cpu"
datasheet = "https://www.ti.com/lit/ds/symlink/tps62869.pdf"
datasheet_rev = "SLVSFS3B"
lifecycle = { status = "Active", source = "TI", read = "2026-10-25" }
second_sources = [{ part = "TPS628691ARQYR", note = "on the same land (start-up voltage set by a resistor on the VSET/VID pin)" }]
notes = [
  "Land pattern = TI example board layout RQY0009A (SLVSFS3B p. 39), non-solder-mask-defined pads (preferred by TI, 0.05 mm max mask clearance all around): pad copper = dimensioned metal, mask expansion left to the board default.",
  "Stencil (SLVSFS3B p. 40, 0.1 mm thick) apertures equal the pads 1:1, so pads keep paste = true.",
  "Pad corner radius (R0.05) TYP (p. 39): rratio = 0.05 / short side = 0.2 for the 0.25 mm wide pads and 0.25 for the 0.2 mm high pads.",
  "Pad centres from reference dimensions on p. 39: 4X (0.5) pitch with pins 9 and 5 on the vertical package centreline; (2.35) between the top and bottom rows, centred on the package; long pads 3X (0.95) x 3X (0.2) from the vertical centreline outwards (pins 2, 3 left, pin 7 right), (0.95) between the centres of the left and right long pads; 2X (0.4) from pins 2 and 3 to the horizontal centreline, pin 7 on it.",
  "Body z = 1.0 mm is the maximum height (0.8-1.0, SLVSFS3B p. 38); body x/y are nominal (1.4-1.6 x 2.4-2.6).",
  "Orientation: top view as TI's land pattern example and Figure 6-1 top view (p. 4): pins 1-9-8 along the top edge, pin 1 top-left, pin 1 index area top-left (p. 38 top view).",
]

