# TPS62870Z4WRXSR - TI 6 A synchronous step-down converter with I2C and differential remote sense,
# RXS0016A (VQFN-FCRLF-16, 2.55 x 3.55 mm)
# Sources: SLVSGC5E (TPS6287x datasheet, Jan 2023 rev. Oct 2025), PDF pp. 4-5 (device options),
# PDF pp. 6-7 (Figure 5-1 top view, Table 5-1 pin functions), PDF pp. 34-35 (Table 7-10, I2C
# address), PDF p. 57 (package option addendum, 3-Apr-2026), mechanical drawing 4226093/E 09/2022:
# PDF p. 64 package outline, PDF p. 65 example board layout (scale 15X), PDF p. 66 example stencil
# design (0.1 mm). Drawings checked against 200 dpi renders.

[part]
mpn = "TPS62870Z4WRXSR"
manufacturer = "Texas Instruments"
library = "texas-instruments"
symbol = "TPS62870Z4WRXSR"
reference = "U"
description = "6 A synchronous step-down converter with I2C and differential remote sense, 2.7-6 V input, Z4 option: 0.875 V start-up and I2C address 0x42 with VSEL tied to VIN, VQFN-FCRLF-16 (RXS0016A) 2.55 x 3.55 mm"
keywords = "buck step-down converter DC-DC I2C remote sense 6A TPS6287x TPS62870 VQFN-FCRLF RXS0016A"
datasheet = "https://www.ti.com/lit/ds/symlink/tps62870.pdf"
datasheet_rev = "SLVSGC5E"
lifecycle = { status = "Active", source = "TI package option addendum (SLVSGC5E PDF p. 57: Active, Production)", read = "2026-10-28" }
second_sources = [{ part = "TPS62871Z4WRXSR", note = "9 A, same RXS0016A package and pinout, same Z4 start-up voltages and addresses (SLVSGC5E PDF p. 5; one pinout for the family, PDF p. 6)" }]
notes = [
  "Device options (PDF p. 5): Z4 start-up voltage and I2C address by VSEL: 6.2 kOhm to GND 0.850 V / 0x40, short to GND 0.750 V / 0x41, short to VIN 0.875 V / 0x42, 47 kOhm to VIN 1.000 V / 0x43; spread spectrum off, soft-start 1 ms by default. Input 2.7-6 V (title, PDF p. 1).",
  "Land pattern = TI example board layout RXS0016A (PDF p. 65, 4226093/E). Pads 1-5 and 9-17 are non-solder-mask-defined (0.05 max mask clearance all around): copper = the drawn exposed metal, mask expansion left to the board default. Pads 6, 7 and 8 are solder-mask-defined (metal under solder mask 0.05 min all around): each is a copper-only polygon pad (the dashed outline, 0.05 outside the exposed metal) plus an aperture pad with the same number (mask opening and paste = the exposed metal, mask margin 0).",
  "Stencil (PDF p. 66, 0.1 mm thick): apertures for pads 1-16 equal the exposed metal (pads keep paste); pad 17 has two 1.17 x 1.0 apertures at y = -0.6 and +0.6 ((0.6), (0.2) gap) and no paste on the pad itself.",
  "Pad centres from reference dimensions on PDF p. 65: columns (2.35) apart, rows 20X (0.5) with the SYMM centre line on pins 4 and 10 (row y = 0); top pads (1.675) above the SYMM line on 20X (0.5) about the vertical SYMM line; pin 1 and 13 vertical legs and pin 6 and 8 spines on 2X (2); pin 1/13 horizontal legs and pin 6/8 middle arms on 2X (3), y = -1.5 and +1.5. Simple pads 11X (0.6) x 11X (0.25); thermal pad (1.25) x (2.25).",
  "Bottom edge of the exposed metal of pads 6, 7 and 8: y = 1.975, mirroring the top pads (1.675 + 0.6/2) and equal to pad 7's (0.6) height from y = 1.375; the drawing prints it as (1.97) from the SYMM line. Pad 7 bar (0.275) high, then three 0.25 fingers under the 20X (0.5) columns.",
  "The (R0.05) TYP corner radius is kept on the rectangular pads (rratio 0.05 / short side) and omitted on the polygon pads 1, 6, 7, 8 and 13, drawn with sharp corners. Thermal vias are optional (PDF p. 65 note 5) and not drawn.",
  "Body z = 1.05 mm is the maximum height (0.95-1.05, PDF p. 64); body x/y are nominal (2.45-2.65 x 3.45-3.65); standoff 0.00/-0.01.",
  "Orientation: top view as TI's land pattern example and Figure 5-1 (PDF p. 6): pin 1 top-left, 16-15-14 along the top, 13 top-right, 2-5 down the left side, 12-9 down the right side, 6-7-8 along the bottom.",
  "Symbol: VIN (5, 9) and GND (6, 8, 17) are separate pins; pin 17 is named GND (Table 5-1: exposed thermal pad, solder to GND).",
]

