name = "OUT"
type = "power_out"
side = "right"

[[pins]]
number = "4"
name = "FLT"
type = "open_collector"
side = "right"
gap = true

[[pins]]
number = "3"
name = "AUXOFF"
type = "open_collector"
side = "right"

[[pins]]
number = "9"
name = "ILM"
type = "passive"
side = "right"
gap = true

[[pins]]
number = "7"
name = "DVDT"
type = "passive"
side = "right"

[[pins]]
number = "10"
name = "ITIMER"
type = "passive"
side = "right"

[[pins]]
number = "8"
name = "GND"
type = "power_in"
side = "bottom"

