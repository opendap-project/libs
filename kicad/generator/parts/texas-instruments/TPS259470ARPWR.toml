# TPS259470ARPWR - TI 2.7-23 V, 5.5 A eFuse with true reverse-current blocking, adjustable OVLO, AUXOFF and FLT,
# auto-retry, VQFN-HR-10 (RPW0010A) 2 x 2 mm
# Sources: SLVSFC9C (TPS25947xx datasheet, Oct 2020 rev. May 2026), PDF pp. 5-6 (Figure 5-1 RPW top view,
# Table 5-1 pin functions); mechanical addendum drawing 4225183/A 08/2019: PDF p. 72 package outline, p. 73
# example board layout, p. 74 example stencil design (PDF page numbers of the cached tps25947.pdf).
# Pad geometry read from 150 dpi renders of pp. 73-74 (177 px/mm at 30X) against the dimension labels.

[part]
mpn = "TPS259470ARPWR"
manufacturer = "Texas Instruments"
library = "texas-instruments"
symbol = "TPS259470ARPWR"
reference = "U"
description = "eFuse, 2.7-23 V, 5.5 A, 28 mOhm, true reverse-current blocking, adjustable UVLO/OVLO and current limit, AUXOFF and FLT outputs, auto-retry, VQFN-HR-10 (RPW0010A) 2 x 2 mm"
keywords = "eFuse hot swap current limit reverse current blocking OVLO TPS25947 TPS259470A VQFN-HR RPW"
datasheet = "https://www.ti.com/lit/ds/symlink/tps25947.pdf"
datasheet_rev = "SLVSFC9C"
sheet = "texas-instruments/TPS259470ARPWR.md"
notes = [
  "Land pattern = TI example board layout RPW0010A (SLVSFC9C p. 73), top view as drawn: IN (5) and OUT (6) are 2X (0.3) x 2X (2.4) bars, centres 2X (0.25) either side of the package centre line; pins 2, 3 (left) and 9, 8 (right) are 8X (0.6) x 4X (0.25) pads at 4X (0.225) from the centre line, (1.8) between the column centres.",
  "Corner pins 1, 4, 7, 10 are L-shaped (p. 73): each is two copper rectangles with the same number, an arm 0.6 x 4X (0.3) on the pad column (centre 0.225 + 4X (0.475) = 0.70 from the centre line) and a leg 4X (0.25) x 4X (0.65) running to the package edge (2X (2.4)), centres (1.45)/2 = 0.725 and 2X (1.75)/2 = 0.875; arm and leg overlap. pad_size checks read the largest piece (the arm).",
  "Stencil (p. 74, 0.100 mm): pads 2, 3, 8, 9 print at pad size; IN and OUT through two 4X (0.28) x 4X (1.06) apertures each at 4X (0.63) from the centre line (82 %); corner pads through an L of 0.6 x 4X (0.275) at 4X (0.4625) from the 0.225 line and 4X (0.225) x 0.65 at (1.425)/2 (93 %). Pads 1, 4, 5, 6, 7, 10 have paste = false.",
  "Non-solder-mask-defined pads, 0.05 mm max opening all around (p. 73): the board default mask expansion applies. Thermal vias under IN and OUT (p. 63, §8.4.1) are a layout choice.",
  "Pin types (Table 5-1): EN/UVLO and OVLO analog inputs (input); AUXOFF and FLT open-drain digital outputs (open_collector); IN, OUT power; DVDT, ILM, ITIMER are R/C setting pins (Analog Output in the table, ILM also the current monitor), passive so that ERC does not read them as drivers.",
  "Pin 2 is OVLO and pin 3 AUXOFF, pin 4 FLT on the TPS259470x; other family members name them OVCSEL, PG, PGTH (Table 5-1). The symbol uses the TPS259470x names.",
]

