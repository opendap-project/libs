# LP5521YQX/NOPB - TI three-channel RGB LED driver with charge pump and I2C, NJA0024A (WQFN-24, 4 x 5 mm)
# Sources: SNVS441I (LP5521 datasheet, January 2007 rev. November 2016), PDF p. 3 (NJA pinout), p. 4
# (Pin Functions LP5521YQ); mechanical addendum drawing 4215212/A 04/2017: PDF p. 48 package outline,
# p. 49 example board layout, p. 50 example stencil design (read from 150 dpi renders; 1 mm = 106.3 px at
# the 18X layout scale, 147.6 px at the 25X stencil scale).

[part]
mpn = "LP5521YQX/NOPB"
manufacturer = "Texas Instruments"
library = "texas-instruments"
symbol = "LP5521YQX"
reference = "U"
description = "Three-channel RGB LED driver, 25.5 mA programmable current sources, 8-bit PWM, program engines, adaptive 1x/1.5x charge pump, I2C, WQFN-24 (NJA0024A) 4 x 5 mm with exposed pad"
keywords = "LED driver RGB charge pump I2C LP5521 WQFN NJA0024A"
datasheet = "https://www.ti.com/lit/ds/symlink/lp5521.pdf"
datasheet_rev = "SNVS441I"
sheet = "texas-instruments/LP5521YQX-NOPB.md"
notes = [
  "Symbol name LP5521YQX: the MPN's '/NOPB' suffix cannot be part of a KiCad symbol name; the MPN field keeps it.",
  "Land pattern = TI example board layout NJA0024A (SNVS441I p. 49): 24X (0.4) x 24X (0.25) pads, 20X (0.5) pitch, (3.4) between the left and right pad-column centres, (4.4) between the top and bottom pad-row centres, (R0.05) TYP corners; exposed pad 25 (2.4) x (3.4); non-solder-mask-defined preferred (0.07 MAX all around), mask expansion left to the board default.",
  "Orientation as the p. 49 drawing (top view, body 4 mm in x, 5 mm in y): pins 1-7 down the left side, 8-12 along the bottom, 13-19 up the right side, 20-24 along the top (24 top left). The p. 3 pinout figure shows the same package turned by 90 degrees.",
  "Vias (p. 49): eight (0.2) vias, optional (note 6), filled, plugged or tented under paste. Positions read off the render: centre column at y = +-0.59 and +-1.45 (3X (1.18) between the inner rows, 2X (0.86) to the outer ones), side columns at x = +-0.95 ((0.95) TYP) on the inner rows. Via copper diameter 0.4 mm is an OpenDAP choice (the drawing gives the 0.2 mm hole only): UNVERIFIED.",
  "Stencil (p. 50, 0.1 mm): pads 1:1; exposed pad as 6X (1.06) x (0.98) apertures, columns at x = +-(0.63) TYP, rows at (1.18) TYP pitch centred on the pad, 76 % printed coverage: pad 25 paste = false plus [[footprint.paste]].",
  "Exposed pad 25: soldered to the board (p. 48, note 3); the pin table gives no net. Visible passive pin.",
  "TRIG and CLK_32K are tied to GND when unused (p. 17, §7.3.5.3; p. 17, §7.3.5.5): passive. INT is open drain (p. 4): open_collector. R, G, B are current-source outputs (type A, p. 4): output. Pins 8-12 N/C: visible no_connect pins (CRAFT-125).",
  "Body z = 0.8 mm is the maximum height (0.8 MAX, p. 48); x/y nominal (3.9-4.1 x 4.9-5.1).",
]

