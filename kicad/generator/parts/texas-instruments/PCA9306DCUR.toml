# PCA9306DCUR - TI dual bidirectional I2C-bus and SMBus voltage-level translator, DCU0008A (VSSOP-8)
# Sources: SCPS113O (PCA9306 datasheet, Oct 2004 rev. Sept 2023), PDF p. 4 (Figure 5-2 DCU pinout, Table 5-1
# pin functions), PDF pp. 31-33 (DCU0008A outline, example board layout, stencil; drawing 4225266/A 09/2014).

[part]
mpn = "PCA9306DCUR"
manufacturer = "Texas Instruments"
library = "texas-instruments"
symbol = "PCA9306DCUR"
reference = "U"
description = "Dual bidirectional I2C/SMBus voltage-level translator, pass-gate, 1.2-5 V, enable input, VSSOP-8 (DCU0008A)"
keywords = "level translator level shifter I2C SMBus PCA9306 pass gate VSSOP DCU"
datasheet = "https://www.ti.com/lit/ds/symlink/pca9306.pdf"
datasheet_rev = "SCPS113O"
notes = [
  "Land pattern = TI example board layout DCU0008A (SCPS113O PDF p. 32), the same drawing 4225266/A as SN74AUC1G74DCUR: the [footprint] section is copied from SN74AUC1G74DCUR.toml unchanged (identical footprint file).",
  "SCL1/SDA1/SCL2/SDA2 are bidirectional pass-gate nodes (I/O, Table 5-1): bidirectional. EN: input.",
  "VREF1 is the low-side reference supply: power_in. VREF2 sits on the EN bias node fed through 200 kOhm from the high-side supply (SCPS113O §8.1.2, Figure 8-1), never tied directly to a rail: passive, so ERC does not ask for a driver.",
  "BOM v1.13 (RFC 0014) removes the PCA9306 from the T1 board (BOM v1 line 94); the part stays in the library for other designs.",
]

[[pins]]
number = "3"
name = "SCL1"
type = "bidirectional"
side = "left"

[[pins]]
number = "4"
name = "SDA1"
type = "bidirectional"
side = "left"

[[pins]]
number = "8"
name = "EN"
type = "input"
side = "left"
gap = true

[[pins]]
number = "6"
name = "SCL2"
type = "bidirectional"
side = "right"

[[pins]]
number = "5"
name = "SDA2"
type = "bidirectional"
side = "right"

[[pins]]
number = "2"
name = "VREF1"
type = "power_in"
side = "top"

[[pins]]
number = "7"
name = "VREF2"
type = "passive"
side = "top"

[[pins]]
number = "1"
name = "GND"
type = "power_in"
side = "bottom"

[footprint]
name = "Texas_DCU0008A_VSSOP-8_2.3x2mm_P0.5mm"
description = "Texas Instruments DCU0008A VSSOP-8 (JEDEC MO-187 CA), 2.3 x 2.0 mm body, 0.5 mm pitch, TI example land pattern (SCES537D addendum p. 15, drawing 4225266/A)"
tags = "VSSOP-8 US8 DCU0008A MO-187 Texas"
datasheet = "https://www.ti.com/lit/ds/symlink/sn74auc1g74.pdf"   # shared land: one document for the footprint file
attr = "smd"
courtyard_class = "default"
land_pattern = "manufacturer"
land_pattern_cite = "SCES537D addendum p. 15, DCU0008A example board layout (4225266/A 09/2014); stencil p. 16"
body = { x = 2.3, y = 2.0, z = 0.9, standoff = 0.05, cite = "SCES537D p. 14, DCU0008A outline: 2.2-2.4 (x) x 1.9-2.1 (y), height 0.6-0.9 (z = max), standoff 0.0-0.1 (nominal 0.05)" }
body_offset = [0.0, 0.0]

# Pins 1-4 left (1 top), pins 5-8 right (5 bottom, 8 top). Pad centres x = +-(3.1)/2 = +-1.55,
# y = -0.75 / -0.25 / +0.25 / +0.75 (6X (0.5), symmetric about SYMM).
[[footprint.rows]]
first = 1
count = 4
step = 1
start = [-1.55, -0.75]
pitch = [0.0, 0.5]
size = [0.85, 0.3]
shape = "roundrect"
rratio = 0.17
type = "smd"
cite = "SCES537D p. 15: 8X (0.85), 8X (0.3), 6X (0.5), (3.1) centre to centre, (R0.05) TYP (rratio 0.05/0.3)"

[[footprint.rows]]
