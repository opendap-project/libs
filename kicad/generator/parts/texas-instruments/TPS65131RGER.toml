# TPS65131RGER - TI positive and negative output DC-DC converter, RGE0024B (VQFN-24, 4 x 4 mm)
# Sources: SLVS493E (TPS65131 datasheet), p. 3 (Figure 5-1, Table 5-1), p. 36 (RGE0024B outline,
# drawing 4219013/A 05/2017), p. 37 (example board layout, read from a 100 dpi render), p. 38 (stencil).

[part]
mpn = "TPS65131RGER"
manufacturer = "Texas Instruments"
library = "texas-instruments"
symbol = "TPS65131RGER"
reference = "U"
description = "Dual-output DC-DC converter, boost up to 15 V and inverter down to -15 V, 2.7-5.5 V input, 1.95 A switch limit, power save, VQFN-24 (RGE0024B) 4 x 4 mm with exposed pad"
keywords = "boost inverter dual output DC-DC TPS65131 VQFN RGE0024B"
datasheet = "https://www.ti.com/lit/ds/symlink/tps65131.pdf"
datasheet_rev = "SLVS493E"
notes = [
  "Land pattern = TI example board layout RGE0024B (SLVS493E p. 37): 24X (0.6) x (0.25) pads, 0.5 mm pitch, (3.8) between opposite pad centres, exposed pad (2.45) square with five optional (0.2) vias at (0.975) TYP; non-solder-mask-defined preferred.",
  "Stencil (p. 38, 0.125 mm): pads 1:1, exposed pad as four (1.08) square apertures at (0.64) from the centre lines (78 % coverage): pad 25 paste = false plus [[footprint.paste]].",
  "Via copper diameter 0.4 mm is an OpenDAP choice (the drawing gives the 0.2 mm hole only): UNVERIFIED.",
  "Pins 1/24 (INP), 2/3 (PGND), 5/6 (INN), 13/14 (OUTN) are pairs of pads with their own numbers; every pad is a visible pin. NC pins 12 and 20 are no_connect.",
  "Exposed pad 25: solder to the PGND plane (Table 5-1).",
]

