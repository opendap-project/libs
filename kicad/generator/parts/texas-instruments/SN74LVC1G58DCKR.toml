# SN74LVC1G58DCKR - TI configurable multiple-function gate, DCK0006A (SC-70-6)
# Sources: SCES415N (SN74LVC1G58 datasheet, rev. Dec 2013), p. 1 (DCK pinout, top view), p. 2
# (function table), p. 15 (DCK0006A outline, 4214835/D), p. 16 (example board layout), p. 17 (stencil).

[part]
mpn = "SN74LVC1G58DCKR"
manufacturer = "Texas Instruments"
library = "texas-instruments"
symbol = "SN74LVC1G58DCKR"
reference = "U"
description = "Configurable multiple-function gate (AND, OR, NAND, NOR, XOR, inverter, buffer by wiring), Schmitt-trigger inputs, 1.65-5.5 V, Ioff, SOT/SC-70-6 (DCK0006A)"
keywords = "logic gate configurable Schmitt LVC SN74LVC1G58 SC-70 DCK"
datasheet = "https://www.ti.com/lit/ds/symlink/sn74lvc1g58.pdf"
datasheet_rev = "SCES415N"
notes = [
  "Land pattern = TI example board layout DCK0006A (SCES415N p. 16, drawing 4214835/D): six pads 0.9 x 0.4 mm (reference), 0.65 mm pitch, 2.2 mm between pad-row centres; non-solder-mask-defined preferred; stencil p. 17.",
  "The DCK0006A land is shared with SN74LVC1G57DCKR, SN74AXC1T45DCKR and TPS22919DCKR (same drawing 4214835): the [footprint] section is identical in every file; its cites name SCES414P, and SCES415N pp. 15-17 give the same drawing 4214835/D.",
  "Pin names and numbers as the sheet (SCES415N p. 1): In0, In1, In2, Y; the same as the SN74LVC1G57 DCK package.",
]

