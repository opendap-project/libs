# TPS2121RUXR - TI 2.8-22 V dual-input priority power mux, 4.5 A, RUX0012A (VQFN-HR-12, 2 x 2.5 mm)
# Sources: SLVSEA3F (TPS212x datasheet, Aug 2018 rev. Aug 2020), PDF pp. 4-5 (Figure 6-2 RUX pinout,
# pin functions); mechanical addendum drawing 4224010/A 11/2017: PDF p. 38 package outline, p. 39
# example board layout, p. 40 example stencil design (PDF page numbers of the cached tps2121.pdf).
# Pad centres were read from a 150 dpi render of p. 39 against the dimension labels (125 px/mm).

[part]
mpn = "TPS2121RUXR"
manufacturer = "Texas Instruments"
library = "texas-instruments"
symbol = "TPS2121RUXR"
reference = "U"
description = "2.8-22 V dual-input priority power multiplexer with seamless switchover, 4.5 A, adjustable current limit, VQFN-HR-12 (RUX0012A) 2 x 2.5 mm"
keywords = "power mux multiplexer priority switchover ideal diode TPS2121 VQFN-HR RUX0012A"
datasheet = "https://www.ti.com/lit/ds/symlink/tps2121.pdf"
datasheet_rev = "SLVSEA3F"
sheet = "texas-instruments/TPS2121RUXR.md"
notes = [
  "Land pattern = TI example board layout RUX0012A (SLVSEA3F p. 39): eight signal pads (0.2) x (0.6) at 6X 0.5 pitch in two rows (2.3) apart (pins 12-9 on top, 3-6 on the bottom); four power pads 4X (1.05) x 4X (0.4), (1.35) between the column centres and 2X (0.7) between the row centres (pins 1, 2 left, 8, 7 right).",
  "Non-solder-mask-defined pads (0.05 MAX all around, p. 39): the mask expansion is left to the board default. The drawing shows vias in the power pads (VIA TYP): a layout choice, not part of the footprint.",
  "Stencil (p. 40): apertures equal the pads (100 % printed coverage), so paste = true.",
  "Body z = 1.0 mm is the maximum height (1 MAX, p. 38); x/y nominal (1.9-2.1 x 2.4-2.6).",
  "OUT is two pads (1, 8): pin 1 power_out, pin 8 passive, so ERC reads one driver.",
]

