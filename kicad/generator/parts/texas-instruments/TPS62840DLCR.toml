# TPS62840DLCR - TI 750 mA ultra-low-Iq step-down converter, DLC0008B (VSON-HR-8, 1.5 x 2 mm)
# Sources: SLVSEC6D (TPS62840 datasheet), PDF p. 5 (pin functions), mechanical addendum drawing
# 4224310/A 05/2018: PDF p. 36 package outline, p. 37 example board layout, p. 38 example stencil
# design (PDF page numbers of the cached tps62840.pdf; drawing text read with pdftotext -layout).

[part]
mpn = "TPS62840DLCR"
manufacturer = "Texas Instruments"
library = "texas-instruments"
symbol = "TPS62840DLCR"
reference = "U"
description = "750 mA step-down converter, 60 nA quiescent current, 1.8-6.5 V input, 1.8-3.3 V output set by one VSET resistor, MODE and STOP pins, output discharge, VSON-HR-8 (DLC0008B) 1.5 x 2 mm"
keywords = "buck step-down converter DC-DC low-Iq 750mA TPS62840 VSON-HR DLC0008B"
datasheet = "https://www.ti.com/lit/ds/symlink/tps62840.pdf"
datasheet_rev = "SLVSEC6D"
notes = [
  "Land pattern = TI example board layout DLC0008B (SLVSEC6D p. 37): 8X (0.6) x 8X (0.25) pads, 6X (0.5) pitch, (1.3) between pad-row centres, (R0.05) TYP corners; non-solder-mask-defined (preferred, 0.05 MAX mask clearance), so the mask expansion is left to the board default.",
  "Pad order read from the p. 37 drawing: pad 1 top left, 1-4 down the left row, 5 bottom right, 8 top right (consistent with the p. 36 outline, pins 1 and 8 at the same end).",
  "Stencil (p. 38, 0.1 mm thick): apertures equal the pads, so paste = true.",
  "Body z = 1.0 mm is the maximum height (1 MAX, p. 36); x/y nominal (1.4-1.6 x 1.9-2.1).",
  "No exposed pad (p. 36).",
]

[[pins]]
number = "2"
name = "VIN"
type = "power_in"
side = "top"

[[pins]]
number = "4"
name = "EN"
type = "input"
side = "left"

[[pins]]
number = "3"
name = "MODE"
type = "input"
side = "left"
gap = true

[[pins]]
number = "6"
name = "STOP"
type = "input"
side = "left"

[[pins]]
number = "5"
name = "VSET"
type = "passive"
side = "left"
gap = true

[[pins]]
number = "7"
name = "SW"
type = "power_out"
side = "right"

[[pins]]
number = "8"
name = "VOS"
type = "input"
side = "right"

[[pins]]
number = "1"
name = "GND"
type = "power_in"
side = "bottom"

