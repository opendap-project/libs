# ECS-2016MV-120-BN-TR - ECS Inc. ECS-2016MV MultiVolt HCMOS crystal oscillator, 12.000 MHz, +-50 ppm,
# -40 to +85 C, 1.6-3.6 V, tri-state, 2.0 x 1.6 x 0.85 mm ceramic, four pads.
# Source: ECS-2016MV SMD MultiVolt Crystal Oscillator, Rev. 2025 (2 pages), sha256 f179ffbc...1c61872.
# Cited as "ECS-2016MV".
#
# Drawing reading (ECS-2016MV p. 1, 300 dpi render):
#   Figure 1, left view (pin-1 dot): top view, #4 upper-left, #3 upper-right, #1 lower-left, #2 lower-right.
#   Figure 1, middle view (hatched pads, #1 chamfered): bottom view, #1 upper-left, #2 upper-right,
#   #4 lower-left, #3 lower-right (the top view flipped about the long axis).
#   Figure 2, "Suggested Land Pattern": four equal lands, horizontally 0.775 / 0.5 / 0.775, vertically
#   0.675 / 0.3 / 0.675, i.e. lands 0.775 (x) x 0.675 (y) with a 0.5 gap in x and a 0.3 gap in y.
#   The view carries no pad numbers; since the four lands are equal, numbering follows the top view.
#   Land centres in the catalogue orientation (long axis horizontal): x = +-(0.25 + 0.3875) = +-0.6375,
#   y = +-(0.15 + 0.3375) = +-0.4875.
# Orientation: rotated 90 deg clockwise (as seen from the top, +y down), (x, y) -> (-y, x), so that #1 is
# top-left as in the NDK NZ2520SDA parts of this library. Body 1.6 (x) x 2.0 (y); lands 0.675 (x) x 0.775 (y).
#   #1 (-0.4875, -0.6375)  #4 (0.4875, -0.6375)
#   #2 (-0.4875,  0.6375)  #3 (0.4875,  0.6375)

[part]
mpn = "ECS-2016MV-120-BN-TR"
manufacturer = "ECS Inc."
library = "ecs"
symbol = "ECS-2016MV-120-BN-TR"
reference = "Y"
description = "12.000 MHz HCMOS crystal oscillator, ECS-2016MV MultiVolt (1.6-3.6 V), +/-50 ppm, -40 to +85 C, tri-state, 2.0 x 1.6 mm, 4 pads"
keywords = "oscillator XO crystal clock HCMOS ECS-2016MV 12 MHz 2016 MultiVolt"
datasheet = "https://ecsxtal.com/store/pdf/ECS-2016MV.pdf"
datasheet_rev = "Rev. 2025"
notes = [
  "Land pattern = ECS suggested land pattern (ECS-2016MV p. 1, Figure 2): lands 0.775 x 0.675, gaps 0.5 and 0.3; rotated 90 deg so pin 1 is top-left.",
  "The suggested land pattern carries no pad numbers; pin 1 follows the top view (dot at #1, lower-left before rotation). The four lands are identical, so the numbering is the only reading involved.",
  "Lands drawn as plain rectangles; mask and paste rules are not given (UNVERIFIED): mask to the board default, paste 1:1 (generator default).",
  "Body height: only 0.85 mm max is given (ECS-2016MV p. 1); the 3D envelope uses the maximum.",
  "Pin 1 Tri-state: >= 0.7 x Vdd or not connected -> output active (ECS-2016MV p. 1): input.",
]

