# SLB9673XU20FW2613XTMA1 - Infineon OPTIGA TPM SLB 9673 (TPM 2.0, I2C), standard temperature range,
# firmware 26.13, PG-UQFN-32-1/-2, 5 x 5 mm, 0.5 mm pitch, exposed pad to GND.
# Source: Infineon "OPTIGA TPM SLB 9673 TPM2.0" data sheet, Revision 1.3, 2023-05-02 ("DS"), 22 pages,
# fetched from a distributor copy of the Infineon document (farnell.com/datasheets/4146092.pdf; infineon.com
# product pages answer 404 to non-browser fetches). Printed page numbers = PDF page numbers.
#   p. 6 Table 1 (SLB 9673XU2.0 FW26.xx = standard temperature -40 to 85 C), §1.2 (I2C address 0x2E);
#   p. 7 Figure 1 (pinout, top view) and Table 3; p. 8 Tables 3-5; p. 16 Figure 4 (package dimensions);
#   p. 17 Figure 6 (recommended footprint: copper/solder mask view and stencil view).
# Figure 6 reading (600 dpi render, dimension lines identified on the drawing):
#   4.1 = distance between the INNER edges of opposite pad rows (both axes); 0.7 = pad length; 0.25 = pad
#   width; 0.5 = pitch; 3.6 x 3.6 = exposed-pad copper. Pad centres = 4.1/2 + 0.7/2 = 2.40 from the origin;
#   8 pads per side at 0.5 -> centres +-0.25, +-0.75, +-1.25, +-1.75. Outer pad extent 5.5.
#   Stencil view: signal apertures equal the pads (0.25 x 0.7, same 4.1 / 0.7 / 0.25 dimensions); exposed
#   pad 2 x 2 apertures 1.4 x 1.4 with 0.4 between them (centres +-0.9; the 0.25 dimension there is the
#   pin pitch half-offset 0.25 from the centre line, not an aperture gap).
# Pin numbering: Figure 1 (top view), pin 1 (VDD) top of the left side, counter-clockwise: 1-8 left
# (top to bottom), 9-16 bottom (left to right), 17-24 right (bottom to top), 25-32 top (right to left).
# Figure 4 (terminal view, pin 1 at the lower right) is the bottom view of the same sequence.

[part]
mpn = "SLB9673XU20FW2613XTMA1"
second_source = "ST ST33KTPM2 I2C build (not pin-compatible; BOM v1 line 122)"
manufacturer = "Infineon"
library = "infineon"
symbol = "SLB9673XU20FW2613XTMA1"
reference = "U"
description = "OPTIGA TPM SLB 9673 TPM 2.0, I2C up to 1 MHz, 1.8 V or 3.3 V, -40 to 85 C, PG-UQFN-32 5 x 5 mm, 0.5 mm pitch, exposed pad"
keywords = "TPM TPM2.0 trusted platform module security OPTIGA SLB9673 I2C UQFN32 Infineon"
datasheet = "https://www.farnell.com/datasheets/4146092.pdf"
datasheet_rev = "Revision 1.3, 2023-05-02"
notes = [
  "Package confirmed: PG-UQFN-32-1/-2, 5 x 5 mm, 0.6 mm max height, 0.5 mm pitch, exposed pad 3.6 x 3.6 (DS p. 16, Figure 4); this closes the BOM v1 line 122 'UQFN-32 5 x 5 mm UNVERIFIED'.",
  "Land pattern = Infineon recommended footprint (DS p. 17, Figure 6): 32 pads 0.25 x 0.7, 0.5 pitch, 4.1 between the inner edges of opposite rows, exposed pad 3.6 x 3.6 to GND; stencil 2 x 2 apertures 1.4 x 1.4, 0.4 apart, on the exposed pad; signal apertures equal to the pads.",
  "Figure 6 draws the solder-mask opening slightly larger than each pad but does not dimension it: the mask expansion is left to the board default (UNVERIFIED against Infineon's intent). Pad corners are drawn square: rect pads.",
  "Datasheet URL is the distributor copy of the Infineon document (infineon.com was not fetchable without a browser on 2026-10-25); the Infineon original link is UNVERIFIED.",
  "NC pins 6, 19, 21, 24 must be left floating (DS p. 8, Table 5): no_connect. NCI pins 5, 10-13, 15, 25-28, 31 are not connected internally (may be connected): no_connect. Pin 8 NCI/VDD and pin 16 NCI/GND are the TCG VDD/GND positions (may be tied for TCG compliance): passive.",
  "I2C_PIRQ# is an open-drain output (DS p. 7, Table 3): open_collector. TEST# must be tied to a static high level (p. 8): input. GPIO_00-02 may be left unconnected, internal pull-ups (p. 8): bidirectional.",
  "Exposed pad: internally connected to GND, shall be connected to GND (DS p. 17): pin EP, power_in, bottom.",
]

