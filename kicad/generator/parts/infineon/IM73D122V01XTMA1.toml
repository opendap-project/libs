# IM73D122V01XTMA1 - Infineon XENSIV digital PDM MEMS microphone, bottom port, PG-LLGA-5-3
# Sources: IM73D122V01 datasheet v1.00 (2022-08-12), p. 11 (Figure 12 package drawing, Table 9 pin
# configuration), p. 12 (§5 and Figure 13, footprint and stencil recommendation).

[part]
mpn = "IM73D122V01XTMA1"
manufacturer = "Infineon"
library = "infineon"
symbol = "IM73D122V01XTMA1"
reference = "MK"
description = "Digital PDM MEMS microphone, bottom port, 73 dB(A) SNR, -26 dBFS, 122 dBSPL AOP, 1.62-3.6 V, PG-LLGA-5-3 (4 x 3 x 1.2 mm)"
keywords = "microphone MEMS PDM digital bottom port XENSIV IM73D122 LGA"
datasheet = "https://www.infineon.com/assets/row/public/documents/24/49/infineon-im73d122-datasheet-en.pdf"
datasheet_rev = "v1.00 (2022-08-12)"
sheet = "infineon/IM73D122V01XTMA1.md"
notes = [
  "Land pattern = Infineon recommendation, Figure 13 (p. 12), solder-mask-defined pads: four signal pads 4x 0.75 x 4x 0.45 copper, 1.7 mm across (0.85 from the centre line), 2x 0.7 between rows; a copper ring R0.58-R1.04 (pad 5, GND) around a PCB acoustic port R0.4 (0.8 mm NPTH, §5 text p. 12).",
  "Positions: Figure 13 dimensions 0.68 (ring centre to the marked body centre), 0.8 (body centre to the near pad row) and 0.7 (row to row). Cross-check with Figure 12 (p. 11): port centre 1.32 from the body edge and 1.48 to the near pad row; 4/2 - 1.32 = 0.68.",
  "Pin numbering in the top view: Figure 12 is a bottom view (pins 1, 2 left top to bottom, 3, 4 right, port below); mirrored and turned 180 deg to Figure 13's orientation (port on top) pin 1 is the lower-left pad, as Figure 13's Pin1 label shows.",
  "Mask: Figure 13 shows solder-mask-defined copper but gives no separate mask-opening dimension; the pads open the mask at the copper size (no margin). The mask opening of a solder-mask-defined design is UNVERIFIED.",
  "Stencil: signal apertures 4x 0.65 x 4x 0.4 at the pad centres; ring apertures six sectors R0.6-R1, 6x 0.12 gaps, (52 deg) per sector (reference), gaps on the horizontal centre line and every 60 deg. Figure 13's undimensioned 0.2 mm corner radii on the sectors are not drawn (sharp corners): UNVERIFIED that this matters for the paste volume.",
]

