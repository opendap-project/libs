# RK809-5 PMIC, QFN68 7 x 7 mm, 0.35 mm pitch.
# Source: Rockchip RK809 Datasheet Rev 1.01 (2018-08-28); page numbers are PDF page numbers (= printed footers).
# The datasheet gives package dimensions only (p. 13, Fig. 2-1); no land pattern, stencil or via pattern.
# The land pattern below is DERIVED per IPC-7351B nominal density (land_pattern = "ipc7351b").
#
# Package (p. 13, Fig. 2-1 table, checked against the rendered drawing):
#   D = E = 7 BSC; L = 0.30 / 0.40 / 0.50; b = 0.10 / 0.15 / 0.20; e = 0.35 BSC;
#   D1 = E1 (EP) = 5.39 / 5.49 / 5.59; A = 0.70 / 0.75 / 0.80; A1 = 0 / 0.035 / 0.05.
#   17 terminals per side (68 / 4), pin 1 top of left side, numbering counter-clockwise viewed from the top
#   (Fig. 2-2, p. 14; bottom view in Fig. 2-1 shows the mirror: 1 top-right, 17/18 bottom-right, 34/35 bottom-left, 51/52 top-left).
#
# IPC-7351B derivation (nominal density). J values as tabulated for IPC-7351B nominal density; UNVERIFIED against the standard text:
#   Jt (toe) = 0.30, Jh (heel) = 0.00, Js (side) = -0.04; F (fabrication) = 0.05, P (placement) = 0.05.
#   Outer terminal span Lspan = D = 7.00 (BSC, Ltol = 0 taken; the drawing gives no tolerance on D).
#   Zmax = Lmin + 2 Jt + sqrt(Ltol^2 + F^2 + P^2) = 7.00 + 0.60 + 0.0707 = 7.6707 -> 7.67
#   Smin = D - 2 Lmax = 6.00; Smax = D - 2 Lmin = 6.40; Stol = 0.40
#   Stol(RMS) = sqrt(Ltol^2 + 2 Ttol^2) = sqrt(0 + 2 * 0.20^2) = 0.2828; Smax(RMS) = Smax - (Stol - Stol(RMS))/2 = 6.3414
#   Gmin = Smax(RMS) - 2 Jh - sqrt(Stol(RMS)^2 + F^2 + P^2) = 6.3414 - 0 - 0.2915 = 6.0499 -> 6.05
#   Xmax = Wmin + 2 Js + sqrt(Wtol^2 + F^2 + P^2) = 0.10 - 0.08 + 0.1225 = 0.1425 -> 0.14
#   Pad length = (Z - G)/2 = 0.81; pad centre = (Z + G)/4 = 3.43; pad width 0.14.
#   Copper gap between adjacent pads = 0.35 - 0.14 = 0.21. Inner pad edge 3.025 vs EP edge 2.745: 0.28 clearance.
#   Corner check: last pad of a row ends at 2.80 + 0.07 = 2.87 < 3.025 (inner edge of the adjacent row): no overlap.
#
# Exposed pad: land = nominal EP 5.49 x 5.49 (OpenDAP choice, the datasheet gives no land).
# EP paste: 4 x 4 apertures 1.00 x 1.00 at 1.45 pitch = 16.0 mm^2 / 30.14 mm^2 = 53 % coverage (OpenDAP choice).
# Thermal vias: 3 x 3 at 1.45 pitch, drill 0.20, diameter 0.40, placed at the intersections of the 0.45 mm
#   paste-free channels between apertures (0.025 mm clearance to each aperture) (OpenDAP choice).

[part]
mpn = "RK809-5"
second_source = "Rockchip RK817-5 (BOM v1 line 2)"
manufacturer = "Rockchip"
library = "Rockchip_PMIC"
symbol = "RK809-5"
reference = "U"
description = "PMIC: five synchronous bucks, nine LDOs, two power switches, RTC with 32.768 kHz output, fuel gauge, audio codec; QFN68 7 x 7 mm, 0.35 mm pitch, exposed ground pad"
keywords = "PMIC buck LDO RTC codec fuel gauge RK809 Rockchip QFN68"
datasheet = "https://rockchip.fr/RK809%20datasheet%20V1.01.pdf"
datasheet_rev = "Rev 1.01"
sheet = "Rockchip/RK809-5.md"
notes = [
  "Land pattern derived per IPC-7351B nominal density from Fig. 2-1 (p. 13): the datasheet has no recommended land pattern. J values UNVERIFIED against the standard text.",
  "0.35 mm pitch: pads 0.14 mm wide leave a 0.21 mm copper gap. With a 0.05 mm solder-mask expansion per side the mask web is 0.11 mm, at or below many fabs' minimum mask sliver (fab-dependent, UNVERIFIED). Confirm with the fab: either a tighter mask expansion (e.g. 0.025 mm -> 0.16 mm web) or a gang (no-web) mask opening per side. Not decided here.",
  "IPC side-fillet formula with b = 0.10-0.20 gives X = 0.14 mm, narrower than the nominal lead (0.15). Review whether a 0.15-0.17 mm pad is preferred; a wider pad shrinks the mask web further.",
  "Exposed-pad land (nominal EP 5.49 mm), paste apertures (4 x 4, 1.00 mm at 1.45 mm, 53 %) and thermal vias (3 x 3, 0.20/0.40 mm at 1.45 mm) are an OpenDAP choice, not from the datasheet. 0.20 mm drills need the fab's small-via capability; tenting/plugging of the vias UNVERIFIED (not decided).",
  "Package D/E given as 7 BSC with no tolerance; Ltol = 0 used in the derivation.",
  "Pins 42/43: Fig. 2-2 (p. 14) names MIC1N/MIC1P, the pin table (p. 15) MICIN/MICIP; symbol uses MIC1N/MIC1P, sheet_name keeps the sheet text.",
  "EP named GND in the symbol (sheet: 'Exposed pad', type G, ground).",
]

