# LBES5PL2EL-923 - Murata Type 2EL Wi-Fi 6 + Bluetooth 5.4 + 802.15.4 module (NXP IW612), LGA-107, 8.8 x 7.7 x 1.3 mm.
# The module datasheet (Murata "Type 2EL Datasheet", pim.murata.com TYPE2EL_PDF) could not be obtained: it
# answers 403 to non-browser fetches (2026-10-24, again 2026-10-25). Sources used instead:
#   E2B-54-1953 Rev. 2.0 (Type 2EL/2DL/2LL/2KL Unified Design Guide, 2025-08-21), p. 9 Figure 5 (pin
#     assignments, top view), pp. 10-11 Table 3 (terminal names, Type 2EL column);
#   E2B-09-1413 Rev. 9.0 (Type 2EL/2DL Hardware Application Note, 2026-05-21), §3.4 (the footprint is
#     provided as a DXF on the website), Figure 5 (reference schematic);
#   Murata "Module footprint, top view" DXF (2023-07-13, sha256 b9979fee8cb0ad645944f82bdc85baac4b92061e385d450f8130526bcb4c4970);
#   Type 2EL Product Brief (March 2023): "Size: 7.7 x 8.8 x 1.3 mm".
# DXF reading: layer "NC_Work2" holds 428 LINE entities forming 107 closed rectangles, all 0.55 x 0.25 mm
#   (75 long in x, 32 long in y), plus the text "(TOP VIEW)"; layer "ProductsBoradOutline" holds the 8.8 x 7.7 mm
#   outline with its corner at (0, 0). No pad numbers are in the DXF. Pads were numbered by matching the DXF grid
#   to E2B-54-1953 Figure 5: pin 1 is the bottom-left corner pad (DXF y up), 1-16 along the bottom left to right,
#   17-27 up the right side, 28-43 along the top right to left, 44-54 down the left side, 55-107 the inner grid;
#   the one empty inner position (DXF x 2.025, y 1.85, left of pin 55) is the same in both. Footprint frame:
#   X = x_dxf - 4.4, Y = 3.85 - y_dxf (body centre at the origin, +y down).
# DXF pad grid: perimeter pitch 0.5 mm (corner pads 0.725 mm from their neighbours), perimeter columns at
#   x = 0.575 / 8.225, rows at y = 0.575 / 7.125; inner grid 6 columns at 0.95 mm pitch (x 2.025-6.775) and
#   9 rows at 0.5 mm pitch (y 1.85-5.85).

[part]
mpn = "LBES5PL2EL-923"
second_source = "u-blox MAYA-W271-00B (same IW612 chip, other land; pin compatibility UNVERIFIED; BOM v1 line 55)"
manufacturer = "Murata"
library = "murata"
symbol = "LBES5PL2EL-923"
reference = "U"
description = "Murata Type 2EL module, NXP IW612: Wi-Fi 6 802.11a/b/g/n/ac/ax 1x1 2.4/5 GHz (SDIO 3.0), Bluetooth 5.4 BR/EDR/LE (UART, PCM), IEEE 802.15.4 (SPI), LGA-107 8.8 x 7.7 x 1.3 mm"
keywords = "Wi-Fi WiFi 6 802.11ax Bluetooth BLE 802.15.4 Thread module IW612 Murata Type 2EL LBES5PL2EL SDIO"
datasheet = "https://www.murata.com/en-us/products/connectivitymodule/wi-fi-bluetooth/overview/lineup/type2el"
datasheet_rev = "Type 2EL Datasheet not obtained (403); pins from E2B-54-1953 Rev. 2.0, land from footprint DXF 2023-07-13"
notes = [
  "Datasheet field = Murata Type 2EL product page: the Type 2EL Datasheet it links (https://pim.murata.com/asset/pim4/wifiBluetoothModule/TYPE2EL_PDF) answered 403 to non-browser fetches on 2026-10-24 and 2026-10-25.",
  "Pin numbers and names = E2B-54-1953 Rev. 2.0 Table 3, Type 2EL column (pp. 10-11), identical to the parts-lib sheet pin table; positions = Figure 5 (p. 9, top view).",
  "Land pattern = Murata module footprint DXF (top view, 2023-07-13), layer NC_Work2: 107 rectangular pads 0.55 x 0.25 mm. Whether the DXF draws the module terminals or the recommended PCB lands, and the solder-mask and stencil openings, are defined in the datasheet: UNVERIFIED. Mask and paste are drawn equal to the copper (KiCad default) until the datasheet is obtained.",
  "Pin electrical types: the Murata documents read give no pin directions. Types follow the pin names from the module side (TX/RTS/DOUT/_OUT/SPI_TXD/SPI_INT/SD_INT outputs; RX/CTS/DIN/_IN/IND_RST_* inputs; SDIO CLK input, CMD/DAT bidirectional as the SD specification; CONFIG_HOST straps inputs; PCM_CLK/SYNC/MCLK bidirectional because the PCM role is configurable; RF_CNTL outputs, RF_CNTL3/CONFIG_XOSC_SEL and RST_IND bidirectional): UNVERIFIED against the datasheet pin table.",
  "Reserved pins (33-36, 65, 66) are passive (connection rule in the datasheet, UNVERIFIED); NC pins (3, 77-80) are visible no_connect pins (CRAFT-125).",
  "Ground under the module, via rules under the LGA and any keep-out under the body: not in E2B-09-1413 or E2B-54-1953; UNVERIFIED (datasheet).",
  "Units by function: 1 power, 2 host interfaces (SDIO, UART, SPI, PCM, CONFIG_HOST straps), 3 RF, 4 control/reset/wake/coexistence, 5 NC and reserved, 6 ground (49 pins).",
]

