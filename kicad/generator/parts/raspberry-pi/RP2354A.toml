# RP2354A (RP2350A die + 2 MB stacked flash), QFN-60 7 x 7 mm, 0.4 mm pitch.
# Source: RP2350 Datasheet, Release 8, build 80d627281ed5 ("DS"). Page numbers are PRINTED page numbers
# (PDF page = printed + 1 in this build: Figure 148 is on PDF page 1326, printed 1325).
# Land pattern: manufacturer recommended footprint, DS §14.1.2, p. 1325, Figure 148 (top view, dimensions in mm),
# transcribed from the rendered drawing:
#   outer pad-to-pad extent 7.75 (both axes); inner extent 6.00; pad length 0.875 (= (7.75 - 6.00)/2, also dimensioned);
#   pad width 0.20; pitch 0.40; row extent 5.80 outer edge to outer edge (= 14 x 0.40 + 0.20 -> 15 pads per side);
#   centre pad 3.40 x 3.40; 0.975 = row-end pad edge (2.90) to the outer edge of the perpendicular row (3.875).
#   Pad centre = (6.00 + 0.875)/2 = 3.4375 from the origin.
# Package (DS p. 1324, Figure 147): D = E = 7 BSC, A 0.800 / 0.850 / 0.900, A1 0.000 / - / 0.050,
#   D2 = E2 3.350 / 3.400 / 3.450, b 0.130 / 0.180 / 0.230, e 0.400 BSC, L 0.350 / 0.400 / 0.450.
# Pin numbering: Figure 152 (p. 1330), pin 1 top of the left side, counter-clockwise viewed from the top.
# Exposed pad: Figure 148 gives the copper land only. Paste apertures and vias are an OpenDAP choice:
#   2 x 2 apertures 1.25 x 1.25 at 1.70 pitch = 6.25 / 11.56 mm^2 = 54 %; 5 vias (plus pattern) drill 0.20,
#   diameter 0.40 in the 0.45 mm paste-free cross. GND reaches the die only through the exposed pad (Table 1679, p. 1335).

[part]
mpn = "RP2354A"
manufacturer = "Raspberry Pi"
library = "Raspberry_Pi"
symbol = "RP2354A"
reference = "U"
description = "RP2350 microcontroller with 2 MB of QSPI flash stacked in the package, 30 GPIOs, QFN-60 7 x 7 mm, 0.4 mm pitch, exposed GND pad"
keywords = "microcontroller MCU RP2350 RP2354 Cortex-M33 RISC-V flash QFN60 Raspberry Pi"
datasheet = "https://datasheets.raspberrypi.com/rp2350/rp2350-datasheet.pdf"
datasheet_rev = "Release 8, build 80d627281ed5"
sheet = "Raspberry-Pi/RP2354A.md"
notes = [
  "Land pattern = manufacturer recommended PCB footprint, DS p. 1325 Figure 148 (signal pads 0.875 x 0.20 mm, centre pad 3.40 x 3.40 mm).",
  "Pad and centre-pad corner radii are drawn rounded in Figure 148 but not dimensioned: signal pads roundrect 0.25 ratio and centre pad 0.10 mm radius (rratio 0.03) are UNVERIFIED choices.",
  "Exposed-pad paste (2 x 2, 1.25 mm at 1.70 mm, 54 %) and the 5-via plus pattern (0.20/0.40 mm) are an OpenDAP choice; the datasheet gives neither. Raspberry Pi's KiCad minimal-design footprint was not opened (UNVERIFIED cross-check).",
  "IOVDD pin numbers: Figure 152 (p. 1330, checked in the rendered image) shows IOVDD on 1, 11, 20, 30, 38, 45; Table 1679 (p. 1334) lists IOVDD on 11, 20, 30, 38, 45, 54, which collides with QSPI_IOVDD = 54 in the same table. The symbol follows Figure 152 (pin 1 = IOVDD, pin 54 = QSPI_IOVDD), consistent with the sheet; the table entry is a datasheet error (UNVERIFIED with Raspberry Pi).",
  "RP2354A stacked flash: same pinout as RP2350A (DS §14.3, p. 1327); the internal W25Q16JVWI shares the six QSPI pads, which stay bonded out. QSPI_IOVDD must be 2.97-3.63 V on RP2354 (sheet, DS Table 1688).",
  "The sheet pin table groups pins in ranges; the symbol expands them to one pin per number following Tables 1674-1679 (pp. 1332-1335) and Figure 152. No name differences found.",
  "RP2354A thermal data are 'TBD' in DS Table 1670 (p. 1325).",
]

