# DF40C-100DP-0.4V(51): Hirose DF40 header, 100 contacts, 0.4 mm pitch, double row, vertical SMT (board side of the
# 1.5 mm-stack HAT flat-cable pair). HRS No. 684-4032-1 51.
# Sources:
#   EDC3-311351-00 = Hirose drawing DF40C-*DP-0.4V(51), rev. 7 (2018-11-19), sheet 1/2 (image-only PDF, read from 400 dpi render).
#   DF40 cat. = Hirose DF40 Series catalog, May 1, 2020, p. 10 (Header) [PDF page 10].
#
# Geometry (both sources give the same pattern; the sheet's "dimensioned differently" note is only a different chain):
#   Signal lands 0.23 +/- 0.02 wide at P = 0.4 +/- 0.02; outer edge to edge 3.37 (+0.05/0), inner 2.05 (0/-0.05)
#     -> land length (3.37 - 2.05)/2 = 0.66, land centre y = +/-(3.37 + 2.05)/4 = +/-1.355 (row centres 2.71 apart).
#   Signal span C (drawing) = B (catalog) = 19.6 +/- 0.02 for 100 positions (drawing table, catalog table)
#     = 49 x 0.4 -> 50 signal lands per row, x = -9.8 ... +9.8.
#   Corner (hold-down) lands, one per row end, OUTSIDE the 19.6 span:
#     drawing: 0.35 +/- 0.02 wide, centre 0.475 +/- 0.02 from the last signal-land centre;
#     catalog: 0.3 +/- 0.02 (last signal centre -> inner edge) and 0.65 +/- 0.02 (-> outer edge) = same 0.35 width, centre 0.475.
#     Resolved from the drawing (task instruction); the catalog chain agrees: centre x = +/-(9.8 + 0.475) = +/-10.275.
#     Hold-down lands share the signal rows' 3.37 / 2.05 extension lines (same 0.66 length, same y).
#   Body (drawing): table B = 21.52 +/- 0.2 overall length, 1.85 +/- 0.2 housing width, 2.97 +/- 0.2 over leads,
#     1.14 +/- 0.15 height; the corner lead sits 0.4 outside the first signal lead (P = 0.4 +/- 0.05 in the outline view) and
#     21.52 = 19.6 + 2 x 0.4 + 2 x 0.56, i.e. the housing carries 50 + 2 leads per row.
#   Stencil (drawing): metal mask 120 um, 80 % opening ratio for lead pads (not encoded; see notes).
# Orientation: as drawn (long axis horizontal, triangle mark at the left end); origin at the land-pattern centre.

[part]
mpn = "DF40C-100DP-0.4V(51)"
manufacturer = "Hirose"
library = "Hirose"
symbol = "DF40C-100DP-0.4V(51)"
reference = "J"
description = "DF40 board-to-FPC header, 100 contacts, 0.4 mm pitch, 2 rows, 1.5 mm stack with DF40C-100DS, vertical SMT, 4 corner metal hold-downs"
keywords = "connector board-to-board board-to-FPC header DF40 DF40C 100DP 0.4mm Hirose"
datasheet = "https://www.hirose.com/en/product/document?clcode=&productname=&series=DF40&documenttype=Catalog&lang=en&documentid=en_DF40_CAT"
datasheet_rev = "DF40 catalog 2020-05-01 (p. 10); drawing EDC3-311351-00 rev. 7 (2018-11-19)"
sheet = "Hirose/DF40C-100DS-DP-0.4V.md"
sheet_pins = "none: the sheet lists no per-contact table; contacts numbered 1-100 in the odd/even convention of the footprint (UNVERIFIED against a Hirose numbering), checked by pad_count"
notes = [
  "DISCREPANCY with the parts-lib sheet: the sheet says the four corner contacts are hold-downs and only 96 of 100 are usable. Drawing EDC3-311351-00 and catalog p. 10 show the hold-down leads OUTSIDE the 19.6 mm span of the 100 contacts (50 per row, matching the receptacle's 50 per row over the same 19.6 mm), plus one corner lead per row end: 100 usable contacts + 4 hold-downs (21.52 = 19.6 + 2 x 0.4 + 2 x 0.56). Footprint: 100 numbered lands + 4 unnumbered (no-net) hold-down lands. Please review the sheet's 96-contact budget.",
  "Contact numbering is not given in the DF40 catalog or in drawing EDC3-311351-00, and the parts-lib sheet has no pin table: UNVERIFIED. The footprint uses the KiCad 2-row convention, odd contacts on the upper row and even on the lower row, 1/2 at the end carrying the moulded triangle mark (left in the catalog/drawing views). Header and receptacle face each other when mated, so pin n on one side does not land on pin n on the other with the same convention: map the nets through the mating, not by number, until Hirose's numbering is confirmed.",
  "Hold-down lands are numbered \"\" (no net): neither the sheet nor Hirose numbers them; catalog p. 10 note 3 says not to use them as signal or power contacts. Tie to GND copper if desired by board decision.",
  "Stencil: EDC3-311351-00 recommends a 120 um metal mask with 80 % opening ratio for lead pads; the schema has no per-row paste ratio, so the generator default (1:1) applies. Apply 80 % in the board's paste rules or extend the generator.",
  "Body height 1.14 +/- 0.15 nominal from the drawing; housing outline 21.52 x 1.85 (leads 2.97).",
]

