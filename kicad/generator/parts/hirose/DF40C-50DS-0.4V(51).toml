# DF40C-50DS-0.4V(51): Hirose DF40 receptacle, 50 contacts, 0.4 mm pitch, double row, vertical SMT, 1.5 mm stacking
# height, style C (without reinforcing metal fitting). HRS No. 684-4009-0 51. Placed on the T1 board and on the
# device-side piece; the DF40C-50DP-0.4V(51) headers are on the HAT flat cable (BOM v1 lines 66, 102).
# Source: DF40 cat. = Hirose DF40 Series catalog, edition Aug. 1, 2019 (the copy cached for this part, sha256
#   b806e4a9...e19f, cited by the parts-lib sheet as "catalog 2019"), p. 4, "Receptacle (Stacking height 1.5mm)" and
#   "Recommended PCB layout", left view "DF40C (Without reinforcing metal fitting)" [PDF page 4]; header notes p. 10.
#   No receptacle drawing in the cache. Read from a 150 dpi render and the text layer.
# Geometry (same layout as DF40C-100DS-0.4V(51), only the span changes):
#   Lands 0.2 +/- 0.02 wide at P = 0.4 +/- 0.02; outer edge to edge 3.78 (+0.05/0), inner 2.38 (0/-0.05)
#     -> land length (3.78 - 2.38)/2 = 0.70, land centre y = +/-(3.78 + 2.38)/4 = +/-1.54 (rows 3.08 apart).
#   Span B = 9.6 +/- 0.02 (table, 50 contacts) = 24 x 0.4 -> 25 lands per row; DF40C has no hold-down lands.
#   1.5 max resist-coating area between rows (note 3): not encoded.
#   Body: A = 12.6 +/- 0.2, 2.88 +/- 0.2 housing width (3.38 +/- 0.2 over leads), D = 1.45 +/- 0.15 height (table).
# Orientation: as drawn (long axis horizontal, triangle mark at the left end); origin at the land-pattern centre.

[part]
mpn = "DF40C-50DS-0.4V(51)"
manufacturer = "Hirose"
library = "hirose"
symbol = "DF40C-50DS-0.4V(51)"
reference = "J"
description = "DF40 board-to-FPC receptacle, 50 contacts, 0.4 mm pitch, 2 rows, 1.5 mm stack with DF40C-50DP, vertical SMT, no metal fitting"
keywords = "connector board-to-board board-to-FPC receptacle DF40 DF40C 50DS 0.4mm Hirose"
datasheet = "https://www.hirose.com/en/product/document?clcode=&productname=&series=DF40&documenttype=Catalog&lang=en&documentid=en_DF40_CAT"
datasheet_rev = "DF40 catalog 2019-08-01 (p. 4)"
sheet_pins = "none: the sheet lists no per-contact table; contacts numbered 1-50 in the odd/even convention of the footprint (UNVERIFIED against a Hirose numbering), checked by pad_count"
notes = [
  "Contact numbering is not given in the DF40 catalog, and the parts-lib sheet has no pin table: UNVERIFIED. The footprint uses the KiCad 2-row convention of DF40C-100DS-0.4V(51), odd contacts on the upper row and even on the lower row, 1/2 at the end carrying the moulded triangle mark (left in the catalog view). Header and receptacle face each other when mated: map the nets through the mating, not by number, until Hirose's numbering is confirmed.",
  "Corner contacts 1, 2, 49, 50: the receptacle's own lands are all alike (cat. p. 4, no metal fitting on DF40C), but they mate with the four corner contacts of the DF40C-50DP header, which Hirose says to use as metal fittings, never as signal or power contacts (cat. p. 10, note 3). They stay ordinary passive pins here; the board leaves them off signal and power nets (46 usable positions, BOM v1 line 66).",
  "One unit of 50 pins (CRAFT-126 allows 64 per unit; DF40C-100DS splits only because it has 100).",
  "Land pattern from the catalog only (DF40 cat. p. 4, DF40C view); no Hirose drawing for the receptacle is cached. Worth checking against the receptacle drawing when obtained.",
  "Resist-coating area 1.5 mm max between the rows (cat. p. 4 note 3) is not encoded in the footprint. The connector is not polarized (cat. p. 4 note 4).",
]

