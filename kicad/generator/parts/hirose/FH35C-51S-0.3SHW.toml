  "Contact 1 position UNVERIFIED (not in the catalog; the sheet says the same). Chosen: odd contacts on the 26-land row (n+1)/2, even on the 25-land row, pin 1 at the +x end below the p. 3 polarity mark. Confirm against Hirose's drawing for approval before release.",
  "Sheet has no pin table with names: symbol pins named Pin_1 ... Pin_51 (passive).",
  "Body y extent (3.0) and the 0.35 rear offset are reference dimensions ((3), (0.35)); the body centroid origin depends on them.",
  "Metal-fitting lands are unnumbered (no net); the sheet does not list them as pins.",
  "Stencil from p. 4 (t = 0.1 mm): 0.23 x 0.55 (25-row), 0.23 x 0.65 (26-row), fittings 0.3 x 0.7; not encoded, generator default 1:1 applies. Encode if the generator gains per-row paste apertures.",
]

