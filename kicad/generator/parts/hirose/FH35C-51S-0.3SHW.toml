# FH35C-51S-0.3SHW: Hirose FH35C dual-sided FPC connector, 51 contacts, 0.3 mm pitch (staggered 2 x 0.6 mm rows),
# 0.9 mm high, back-flip actuator, horizontal SMT. Ordered as FH35C-51S-0.3SHW(50), HRS No. CL580-2920-9-50.
# Source: FH35C cat. = Hirose FH35C Series catalog 2013.11 (Aug. 1, 2019 stamp), sha256 8e389661...f789.
#   p. 3 Connector Dimensions + table (n = 51: A 16.9, B 14.4, C 15, D 15.63, E 16.33);
#   p. 4 Recommended Land Dimensions + table (n = 51: B 14.4, C 15) and Recommended Land and Metal Mask Dimensions.
#   Read from 300 and 800 dpi renders; every number below checked on the image.
#
# Recommended land dimensions (p. 4), view "Connector image, mounted surface" (top view of the board):
#   Row R1 (upper in the view, rear): (n-1)/2 = 25 lands, 0.3 +/- 0.02 wide, 0.65 +/- 0.03 long, 0.6 pitch, span B = 14.4.
#   Row R2 (lower in the view):       (n+1)/2 = 26 lands, 0.3 +/- 0.02 wide, 0.8 +/- 0.03 long,  0.6 pitch, span C = 15.
#   Stagger: B is centred in C (each R1 land midway between two R2 lands: 0.3 offset), true position 0.02 to datum X.
#   Vertical chain (3.6) = 0.65 (R1 land) + 2.15 +/- 0.03 (gap between R1 bottom edge and R2 top edge) + 0.8 (R2 land).
#   Metal fittings (2): 0.4 +/- 0.03 wide x 0.95 +/- 0.03 tall; inner edge 0.5 +/- 0.03 outboard of the last R2 land centre
#     (end of C); bottom edge 0.2 +/- 0.03 above the R2 land bottom edge.
#   Connector outline (thin line, "mounted surface"): front/rear edges at R1 top + (0.35) and about 3.0 below it
#     (p. 3 side view depth (3)).
# Coordinates (origin = body centroid: body y from R1 top + 0.35 to + 3.35, so R1 top edge at y = -1.85):
#   R1: y -1.85 ... -1.20, centre -1.525; x = -7.2 ... +7.2.
#   R2: top -1.20 + 2.15 = 0.95, bottom 1.75, centre 1.35; x = -7.5 ... +7.5.
#   Fittings: x = +/-(7.5 + 0.5 + 0.2) = +/-8.2; bottom 1.75 - 0.2 = 1.55, top 0.60, centre 1.075.
#   Body x centred on the lands (symmetric drawing).
# Numbering: contacts alternate R2, R1, R2, ... (odd on the 26-land row, even on the 25-land row). Contact 1 is not dimensioned
#   in the catalog (sheet: UNVERIFIED). Pin 1 is put at the +x end of R2, the end under the triangular "polarity mark" in the
#   p. 3 front view (third-angle projection, x preserved). Numbering therefore runs right to left (pitch -0.3 per contact).
# Orientation: as drawn on p. 4 (mating features as the drawing shows them); pin 1 is bottom-right, not top-left, as a result.
# Stencil (p. 4, t = 0.1): openings 0.23 +/- 0.02 wide x 0.55 +/- 0.02 (R1) / 0.65 +/- 0.02 (R2); rows 2.4 +/- 0.02 apart;
#   fittings 0.3 +/- 0.02 x 0.7 +/- 0.02. Not encoded (no per-row paste field); see notes.

