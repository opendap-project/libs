# LSM6DSV16XTR - ST 6-axis IMU (accelerometer and gyroscope), LGA-14L 2.5 x 3.0 x 0.86 mm
# Sources: DS13510 Rev 4 (LSM6DSV16X datasheet, 25 May 2023), p. 9 (Figure 5, pin connections, bottom view),
# p. 11 (Table 2, pin description), p. 174 (§18, soldering: land pattern in TN0018), p. 175 (Figure 33,
# LGA-14L outline, drawing DM00249496_5; land positions read from a 200 dpi render, 89.3 px/mm).

[part]
mpn = "LSM6DSV16XTR"
manufacturer = "STMicroelectronics"
library = "stmicroelectronics"
symbol = "LSM6DSV16XTR"
reference = "U"
description = "6-axis IMU, 3-axis accelerometer and 3-axis gyroscope, sensor fusion, finite state machine, machine learning core, Qvar, I2C / MIPI I3C / SPI, two interrupts, LGA-14L 2.5 x 3.0 mm"
keywords = "IMU accelerometer gyroscope 6-axis MEMS LSM6DSV16X LGA-14"
datasheet = "https://www.st.com/resource/en/datasheet/lsm6dsv16x.pdf"
datasheet_rev = "DS13510 Rev 4"
sheet = "stmicroelectronics/LSM6DSV16XTR.md"
notes = [
  "Land pattern: DS13510 gives none and refers to ST technical note TN0018 (p. 174). TN0018 could not be fetched from this host (www.st.com timed out, 2026-10-25), so the copper here equals the package lands 1:1 from Figure 33 (p. 175): 14X 0.475 x 0.25 mm, 0.5 mm pitch, 4X (0.1) from the land's outer edge to the body edge. Any TN0018 oversize or mask rule is UNVERIFIED; review this land against TN0018 before the layout is frozen.",
  "Positions (top view, body 3.0 mm in x, 2.5 mm in y, the Figure 33 top view): pins 1-4 down the left side at x = -(1.5 - 0.1 - 0.475/2) = -1.1625, y = -0.75..+0.75 (1.5 between the end lands); pins 5-7 along the bottom at y = +(1.25 - 0.1 - 0.475/2) = +0.9125, x = -0.5..+0.5 (1 between the end lands); pins 8-11 up the right side; pins 12-14 along the top, right to left. Mirrored from the bottom views of Figure 5 (p. 9) and Figure 33 (p. 175).",
  "Paste equals the lands (paste = true): no stencil is given in DS13510; UNVERIFIED against TN0018.",
  "Mode 1 (host interface only, the T1 configuration, Table 2 p. 11): SDx/AH1/Qvar1 and SCx/AH2/Qvar2 tie to Vdd_IO or GND when the analog hub and Qvar are off, OCS_Aux and SDO_Aux tie to Vdd_IO or stay unconnected: all four passive. SDO/SA0 is the SPI data output and the I2C address input: bidirectional. INT2 is also the DEN input: bidirectional.",
  "Pins 6 and 7 are both GND (Table 2): two visible power_in pins.",
  "Body z = 0.86 mm is the maximum height (p. 175); x/y nominal (3.00 +- 0.1 x 2.50 +- 0.1).",
]

