# Coverage check: (2*1.08*1.75 + 4*0.2*0.375) / (2.45*1.95 + 2*0.2*(2.9-1.95)) = 4.08 / 5.16 = 79 %.
[[footprint.paste]]
start = [-0.64, 0.0]
pitch = [1.28, 0.0]
count = [2, 1]
size = [1.08, 1.75]
cite = "SLUSE07B PDF p. 37: 2X (1.08), 2X (1.75), 2X (0.64)"

