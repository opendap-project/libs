# BQ28Z610DRZR-R1, DRZ0012A (VSON-12, 4.0 x 2.5 mm, 0.4 mm pitch, H-shaped exposed pad 13).
# Sources: SLUSE07B p. 3 (Figure 6-1 pinout, top view; Table 6-1), PDF p. 35 (package outline 4218895/B,
# bottom view), PDF p. 36 (example board layout, top view, scale 20X), PDF p. 37 (example stencil design,
# 0.1 mm stencil, 79 % coverage on the exposed pad). Coordinates read from the drawing labels and checked
# against the PDF vector geometry (20X scale, 56.69 pt/mm). Board layout top view: pin 1 top-left,
# 1..6 down the left side, 7..12 up the right side (12 top-right); used as drawn (y down).
# Body: 4.0 mm along x (the pin rows are at x = +/-1.9), 2.5 mm along y.

[part]
mpn = "BQ28Z610DRZR-R1"
second_source = "Texas Instruments BQ40Z50-R2 (BOM v1 line 42, different package)"
manufacturer = "Texas Instruments"
library = "Texas_Instruments"
symbol = "BQ28Z610DRZR-R1"
reference = "U"
description = "Impedance Track gas gauge and protection controller for 1-2 series Li-ion packs, high-side N-FET drive, cell balancing, I2C, VSON-12 (DRZ) 4 x 2.5 mm"
keywords = "fuel gauge gas gauge battery 2S li-ion protection I2C impedance track VSON DRZ"
datasheet = "https://www.ti.com/lit/ds/symlink/bq28z610-r1.pdf"
datasheet_rev = "SLUSE07B"
sheet = "Texas-Instruments/BQ28Z610DRZR-R1.md"
notes = [
  "Land pattern and stencil are TI's example board layout / stencil for DRZ0012A (SLUSE07B PDF pp. 36-37), used as given.",
  "Exposed pad 13 is H-shaped: copper (metal under solder mask, dashed) = 2.55 x 2.05 centre + two 0.3 x 3.0 side bars at x = +/-1.125; solder mask opening (solder-mask-defined) 0.05 mm inside the copper: 2.45 x 1.95 + 0.2 x 2.9 bars, outer (2.45) x (2.9). Built as three rect pads numbered 13 with mask_margin = -0.05; pad_count therefore counts 15 pads.",
  "Exposed pad has no number in the datasheet pin table (PWPD, '—'); the package outline (PDF p. 35) labels it 13, which is used here.",
  "Thermal vias: TI draws five, (0.2) VIA TYP, at (0, 0), (0, +/-0.725), (+/-0.975, 0); only the hole is given. Via copper diameter 0.4 mm is an OpenDAP choice, UNVERIFIED. TI note 5: vias optional; vias under paste filled, plugged or tented (the two at x = +/-0.975 lie under the paste apertures).",
  "The stencil page (PDF p. 37) labels the right-side pins 7 at the top and 12 at the bottom, contradicting the board layout (PDF p. 36), the package outline (PDF p. 35) and Figure 6-1 (12 top-right). The footprint follows the board layout and Figure 6-1; the geometry is symmetric so the stencil is unaffected.",
  "Signal pad corners (R0.05) TYP -> roundrect rratio 0.25; exposed pad pieces drawn as rect (TI rounds the bar ends R0.05; not reproduced).",
  "Signal pads: non-solder-mask-defined preferred, 0.05 mm max all around (PDF p. 36); generator default mask expansion applies.",
]

