pitch = [-0.5, 0.0]
size = [0.25, 0.55]
shape = "roundrect"
rratio = 0.25
type = "smd"
cite = "SLVSES3A p. 44: 3X (0.25), 3X (0.55), (0.925), 6X (0.5), (1) between pins 9 and 7"

