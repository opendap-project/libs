# TCA6416ARTWR - TI 16-bit I2C GPIO expander with VCCI/VCCP level translation, RTW0024B (WQFN-24, 4 x 4 mm)
# Sources: SCPS194F (TCA6416A datasheet, May 2009 rev. January 2023), PDF p. 3 (Figure 5-2, RTW pinout),
# p. 4 (Table 5-1, pin functions); mechanical addendum drawing 4219135/B 11/2016: PDF p. 42 package
# outline, p. 43 example board layout (read from a 100 dpi render), p. 44 example stencil design.

[part]
mpn = "TCA6416ARTWR"
manufacturer = "Texas Instruments"
library = "Texas_Instruments"
symbol = "TCA6416ARTWR"
reference = "U"
description = "16-bit I2C and SMBus I/O expander, separate 1.65-5.5 V I2C-side (VCCI) and port-side (VCCP) supplies, interrupt output, reset input, WQFN-24 (RTW0024B) 4 x 4 mm with exposed pad"
keywords = "GPIO expander I/O expander I2C level translation TCA6416A WQFN RTW0024B"
datasheet = "https://www.ti.com/lit/ds/symlink/tca6416a.pdf"
datasheet_rev = "SCPS194F"
sheet = "Texas-Instruments/TCA6416ARTWR.md"
notes = [
  "Land pattern = TI example board layout RTW0024B (SCPS194F p. 43): 24X (0.6) x 24X (0.24) pads, 20X (0.5) pitch, (3.8) between opposite pad-row centres, (R0.05) TYP corners; exposed pad 25 (2.45) square with five (0.2) vias, one central and four at (0.97) on the centre lines; non-solder-mask-defined preferred (0.07 MAX all around), so the mask expansion is left to the board default.",
  "Stencil (p. 44, 0.125 mm): pads 1:1; exposed pad as 4X (1.08) square apertures at (0.64) TYP from the centre lines, 78 % printed coverage: pad 25 paste = false plus [[footprint.paste]].",
  "Via copper diameter 0.4 mm is an OpenDAP choice (the drawing gives the 0.2 mm hole only): UNVERIFIED.",
  "Pad order read from the p. 43 drawing: pins 1-6 down the left side, 7-12 along the bottom, 13-18 up the right side, 19-24 along the top (24 top left).",
  "Exposed pad 25: Table 5-1 (p. 4) gives no net for it; tying it to GND is the usual practice and is UNVERIFIED for this part. Visible passive pin.",
  "INT is open drain (Table 5-1): open_collector. Ports P00-P17 are push-pull I/O, input at power-on: bidirectional, on the right.",
  "Pins P00-P07: sheet_name P0-P7 is how the kicad-lib sheet reader expands the sheet row '1–8 | P00–P07' (it drops the leading zero); the sheet and Table 5-1 name them P00-P07, as the symbol does.",
  "Body z = 0.8 mm is the maximum height (0.8 MAX, p. 42); x/y nominal (3.85-4.15 square).",
]

