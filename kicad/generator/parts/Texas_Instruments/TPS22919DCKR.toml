name = "NC"
type = "no_connect"
side = "left"
gap = true

[[pins]]
number = "6"
name = "VOUT"
type = "power_out"
side = "right"

[[pins]]
number = "5"
name = "QOD"
type = "passive"
side = "right"

[[pins]]
number = "2"
name = "GND"
type = "power_in"
side = "bottom"

