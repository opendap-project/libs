# LMR33630CRNXR - TI 3.8-36 V, 3 A synchronous step-down converter, 2.1 MHz, RNX0012B (VQFN-HR-12, 2 x 3 mm)
# Sources: SNVSAN3F (LMR33630 datasheet, Aug 2017 rev. Nov 2020), PDF p. 5 (Figure 6-2 RNX top view,
# Table 6-1 pin functions); mechanical addendum drawing 4223969/C 10/2018: PDF p. 48 package
# outline, p. 49 example board layout, p. 50 example stencil design (PDF page numbers of the cached
# lmr33630.pdf). Pad centres were read from 110 dpi renders of pp. 49-50 against the dimension labels.

[part]
mpn = "LMR33630CRNXR"
second_source = "Texas Instruments LMR33620CRNXR (2 A, same package and pins; BOM v1 line 116)"
manufacturer = "Texas Instruments"
library = "Texas_Instruments"
symbol = "LMR33630CRNXR"
reference = "U"
description = "3.8-36 V, 3 A synchronous step-down converter, 2.1 MHz (C version), power good, VQFN-HR-12 (RNX0012B) 2 x 3 mm"
keywords = "buck step-down converter DC-DC 3A 36V LMR33630 LMR33630C inverting buck-boost VQFN-HR RNX0012B"
datasheet = "https://www.ti.com/lit/ds/symlink/lmr33630.pdf"
datasheet_rev = "SNVSAN3F"
sheet = "Texas-Instruments/LMR33630CRNXR.md"
notes = [
  "Land pattern = TI example board layout RNX0012B (SNVSAN3F p. 49): signal pads 11X (0.6) x (0.25); left column (pins 1-4) and right column (pins 8-11) at x = -/+0.9 ((1.8) between column centres); pins 1-2-3 and 11-10-9 at 2X (0.65) pitch, pins 3-4 and 9-8 at (0.5) (4X (0.5)); pins 1 and 11 at (1.125) above the package centre, pins 4 and 8 at (0.675) below it; pins 5-6-7 vertical, (0.5) apart, (1.4) below the centre; SW pin 12 a (0.25) x (1.825) strip on the centre line whose centre sits (0.788) above the package centre. Centres not dimensioned directly (pins 2, 3, 9, 10) follow from the 0.65 and 0.5 pitches and were checked on the render.",
  "Non-solder-mask-defined pads are preferred (p. 49, 0.07 MAX all around), so the mask expansion is left to the board default; TI shows pads 1, 2 and 10-12 solder-mask-defined as an alternative.",
  "Stencil (p. 50): apertures equal the pads except pin 12, split into 2X (0.25) x (0.812) apertures centred (1.294) and (0.282) above the package centre: pin 12 has paste = false and two [[footprint.paste]] entries.",
  "Body z = 0.9 mm is the maximum height (0.8-0.9, p. 48); x/y nominal (1.9-2.1 x 2.9-3.1).",
  "Pins 1 and 11 (PGND) and 2 and 10 (VIN) are two pads each with their own number; the symbol shows every pad. Pin 3 is NC (no internal connection, Table 6-1): TI routes SW to it on the PCB to reach CBOOT; it is a no_connect pin here, and the schematic decides.",
  "The RNX0012C drawing (p. 51, 1 mm max height) has the same land (p. 52); the orderable LMR33630CRNXR is listed with the RNX package (p. 42 addendum), drawing variant not stated: UNVERIFIED which of B or C ships.",
]

