# Same Sky SJ2-35954D-SMT-TR: 3.5 mm 4-conductor (TRRS) audio jack, right angle, SMT, tip and ring-1 switches.
# Primary source: Same Sky datasheet "SERIES: SJ2-3595X-SMT | AUDIO JACK", rev 1.05, dated 09/12/2024, 4 pages,
# downloaded 2026-10-24 from https://www.sameskydevices.com/product/resource/sj2-3595x-smt.pdf
# (sha256 41bfe21d4f246be60a465564fb9388bb5654fc58b0468d37877385496fb6d557). The local cache directory
# was empty; the file is kept only in the scratchpad (w6/). Page 2 rendered and read at 200-500 dpi.
#
# Drawing frame ("Recommended PCB Layout, Top View", p. 2): plug axis horizontal, front nose to the LEFT,
# x' measured from the body front face (datum A, where the 2.00 long nose starts) toward the rear,
# y' from the plug axis (+y' down). The footprint keeps this orientation (mating side at the left, as the
# drawing shows); pin 4 is top-left, pin 1 bottom-left (rotating to put pin 1 top-left would move the
# mating side). Origin = centre of the overall envelope 14.0 x 6.3: x' from -2.00 (nose front) to
# +12.00 (rear) -> centre x' = 5.00; footprint x = x' - 5.00, y = y'.
#
# Pad positions (p. 2 layout): x' = 2.8 (#4 top, #1 bottom), 5.5 (#3), 9.3 (#2), 10.5 (#11, NPTH), 11.5 (#10).
# y: 2.75 from axis to the inner (lower) edge of #2/#10; 5.6 between inner edges of #2/#10 and #3/#11
#    -> #2/#10 centre y' = -(2.75 + 0.80) = -3.55; #3/#11 centre y' = 5.6 - 2.75 + 0.80 = +3.65.
#    2.45 from axis and 4.93 overall locate the inner edges of #4 and #1 (extension lines coincide with
#    those pad edges; pixel check agrees within 0.03 mm): #4 centre y' = -(2.45 + 1.00) = -3.45,
#    #1 centre y' = (4.93 - 2.45) + 1.00 = +3.48. The pads' 2.0/1.6 side is along y, 1.5 along x
#    (measured on the drawing).

[part]
mpn = "SJ2-35954D-SMT-TR"
