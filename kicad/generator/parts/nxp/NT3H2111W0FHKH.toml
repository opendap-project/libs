# NT3H2111W0FHKH - NXP NTAG I2C plus 1k, NFC Forum Type 2 Tag with I2C interface, XQFN8 (SOT902-3),
# body 1.6 x 1.6 x 0.5 mm.
# Source: NXP NT3H2111_2211 product data sheet, Rev. 3.6, 21 July 2023 ("DS"), 84 pages, fetched from
# cache.nxp.com (www.nxp.com answers 404 to non-browser fetches). Page numbers = PDF page numbers.
#   p. 5 Table 1 (ordering: NT3H2111W0FHK, XQFN8, SOT902-3); p. 8 Figure 3 (XQFN8 pinning, transparent top
#   view), p. 9 Table 3 (pin description); p. 70 Figure 31 (package outline SOT902-3); p. 71 Figure 32
#   (footprint information for reflow soldering, sot902-3_fr, issue 13-01-02).
# Figure 32 reading (800 dpi render, 845 px/mm against the 1.000 and 1.200 dimensions):
#   lands D x C = 0.4 x 0.22 (D (8x) on all eight lands, C (7x) on seven); side lands at x = +-0.6
#   (1.200 between column centres), y = -0.5 / 0 / +0.5 (1.000 between the outer row centres); the two
#   centre lands (pins 4 and 8) are 0.22 x 0.4 at x = 0, y = +-0.6 (position read from the drawing:
#   0.10 beyond the outer row centres, consistent with the package e = 0.6; not dimensioned, UNVERIFIED).
#   The eighth land (pin 1, the wider terminal b1 = 0.30 of Figure 31) is 0.32 long instead of C: its
#   inner edge 0.110 from the row centre, outer edge 0.320 further out (dimensions 0.110 and 0.320).
#   The 0.025 offsets are the solder-resist opening around each land (dash-dot outline, as in NXP's
#   sot618-1_fr convention): left to the board default. The SLx x SLy 0.5 x 0.5 dash-dot square at the
#   centre is the "metal area not for soldering" of Figure 31: no land there.
# Orientation: Figure 32 is drawn with the wide land at the lower right, which is Figure 3 rotated 180 deg.
# The footprint follows Figure 3 (pin 1 top-left): 1-3 left top to bottom, 4 bottom centre, 5-7 right
# bottom to top, 8 top centre; the pin-1 land extends upwards (towards the package corner).

