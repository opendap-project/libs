notes = [
  "Ordering code: DS Table 1 lists NT3H2111W0FHK (XQFN8, SOT902-3); the trailing H of NT3H2111W0FHKH is the packing suffix of the orderable part (UNVERIFIED in the DS, which does not list packing codes).",
  "Land pattern = NXP reflow-soldering footprint SOT902-3 (DS p. 71, Figure 32), transcribed as described in the header; the paste deposit is drawn inside each land and not dimensioned separately: paste = land (generator default, UNVERIFIED reduction).",
  "Centre-land position (pins 4 and 8 at y = +-0.6) read from the drawing, not dimensioned: UNVERIFIED.",
  "FD is an open-drain field-detect output (DS p. 2 features, §8.4): open_collector. LA/LB are the antenna coil terminals: passive. VOUT is the energy-harvesting output: power_out.",
  "Body z = 0.5 mm is the maximum height (A max 0.5, DS p. 70); D = E = 1.60 nominal (1.55-1.65).",
]

