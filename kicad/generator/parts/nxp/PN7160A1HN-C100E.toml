# PN7160A1HN/C100E - NXP PN7160 NFC controller with NCI interface, I2C host interface (A), firmware variant 1,
# HVQFN40 (SOT618-1), 6 x 6 x 0.85 mm, exposed VSS pad. The MPN contains a slash: the file and the symbol
# are named PN7160A1HN-C100E; the exact MPN is in the mpn field.
# Sources (both fetched from cache.nxp.com; www.nxp.com answers 404 to non-browser fetches):
#   "DS": PN7160_PN7161 product data sheet, Rev. 4.2, 22 July 2026, 70 pages. p. 5 Table 1 (quick reference),
#     p. 9 Tables 2-3 (ordering: PN7160A1HN/C100E = I2C, FW 12.50.05, HVQFN40, 1-tray), p. 15 Figure 6
#     (HVQFN40 pinning, transparent top view), pp. 15-16 Table 7 (pin description), p. 23 Table 14 (I2C
#     address), p. 44 Table 29 (limiting values).
#   "PI": SOT618-1 package information, 25 November 2022, 5 pages. p. 2 Figure 1 (package outline
#     sot618-1_po), p. 3 Figure 2 (reflow soldering footprint sot618-1_fr, issue 14-08-13).
# PI Figure 2 values: P 0.500, Ax = Ay 7.000 (outer land extent), Bx = By 5.200 (inner land extent),
#   C 0.900 (land length), D 0.290 (land width), SLx = SLy 4.100 (centre land), SPx tot = SPy tot 2.400,
#   SPx = SPy 0.600, nSPx = nSPy 3 (centre paste), Gx = Gy 6.300 (solder resist), Hx = Hy 7.250 (occupied).
#   Land centres = 5.2/2 + 0.9/2 = 3.05 from the origin (= (7.0 - 0.9)/2); 10 lands per side at 0.5 ->
#   +-0.25 ... +-2.25. Centre paste 3 x 3 squares 0.6 at (2.4 - 0.6)/2 = 0.9 pitch.
#   The drawing is NXP's "generic footprint pattern"; the 0.025 offsets are the solder-resist opening
#   around each land, left to the board default.
# Pin numbering: DS Figure 6 (top view), pin 1 top of the left side, counter-clockwise: 1-10 left, 11-20
# bottom, 21-30 right (bottom to top), 31-40 top (right to left); PI Figure 1 is the same sequence.

[part]
mpn = "PN7160A1HN/C100E"
second_source = "NXP PN7161A1HN/C100E (same die, same pinout; BOM v1 line 127)"
manufacturer = "NXP"
library = "nxp"
symbol = "PN7160A1HN-C100E"
reference = "U"
description = "PN7160 NFC controller, NCI, integrated firmware, I2C host interface, reader/writer, card emulation, P2P, HVQFN40 (SOT618-1) 6 x 6 mm, exposed pad"
keywords = "NFC controller reader NCI PN7160 PN7161 I2C HVQFN40 SOT618-1 NXP"
datasheet = "https://www.nxp.com/docs/en/data-sheet/PN7160_PN7161.pdf"
datasheet_rev = "Rev. 4.2, 22 July 2026"
sheet = "nxp/PN7160A1HN-C100E.md"
notes = [
  "Land pattern = NXP reflow soldering footprint SOT618-1 (PI p. 3, Figure 2): 40 lands 0.29 x 0.9 at 0.5 pitch, 5.2 / 7.0 inner / outer extent, centre land 4.1 x 4.1 with 3 x 3 paste squares 0.6 at 0.9 pitch (19 % coverage, calculation). Signal-land paste is drawn inside each land but not dimensioned: paste = land (UNVERIFIED reduction).",
  "No thermal vias are drawn by NXP; none are placed in the footprint (a layout choice).",
  "Pin 22 is TVDD_IN2 in DS Table 7 (p. 16) and 'VDD_IN2' in Figure 6 (p. 15): the symbol follows the table.",
  "Pin types: host-interface pins I/O -> bidirectional; IRQ, CLK_REQ, DCDC_EN, XTAL2, TX1, TX2 outputs; VEN, DWL_REQ, WKUP_REQ, NFC_CLK_XTAL1, RXP, RXN inputs. External supplies VBAT, VBAT2, VDD(UP), VDD(PAD) power_in. VDD(TX), TVDD_IN, TVDD_IN2, VDD, VDD(A), VDD(D), VDD(VMID), VDD(HF), ANT1, ANT2 are 'P' pins tied to each other or to decoupling only (DS Table 7): passive. i.c. (to be left open) and n.c. pins: no_connect.",
  "Exposed pad = VSS, must be connected to ground (DS p. 16, 'Center Pad'): pin EP, power_in.",
  "I2C address 0x28 (7-bit) with I2C_ADR1 = I2C_ADR0 = 0 (DS p. 23, Table 14: 0x50 write / 0x51 read), matching BOM v1 line 127.",
]

