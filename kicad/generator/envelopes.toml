# Shield-can frames of the T1 main board (t1 board hardware/t1-main-board/shields.toml, 2026-10-28):
# outer land size, the 0.4 mm land as the wall, 1.5 mm with the 0.1 mm lid. Placement v1 decision 15.
[[envelope]]
key = "shield-frames"
name = "Shield_Frame_SOC_34.15x19.75mm"
land = "the frame land, centred"
cite = "t1 board shields.toml (2026-10-28): land outer 34.15 x 19.75 mm, land 0.4 mm, height 1.5 mm with a 0.1 mm lid; UNVERIFIED until the maker's drawing"
boxes = [
    { size = [34.15, 0.4, 1.5], at = [0.0, -9.675, 0.0] },
    { size = [34.15, 0.4, 1.5], at = [0.0, 9.675, 0.0] },
    { size = [0.4, 19.75, 1.5], at = [-16.875, 0.0, 0.0] },
    { size = [0.4, 19.75, 1.5], at = [16.875, 0.0, 0.0] },
    { size = [34.15, 19.75, 0.1], at = [0.0, 0.0, 1.4] },
]

