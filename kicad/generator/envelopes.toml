# 3D envelope models for lands the library does not draw: KiCad stock footprints whose KiCad 10
# library ships no model, and project lands of OpenDAP boards. kigen.py writes each entry to
# generator/models/<key>/<name>.json; model.py builds 3dmodels/<key>.3dshapes/<name>.step.
#
# Each entry: key (maker library), name (the STEP file name; a consumer's footprint references
# ${OPENDAP_KICAD_3DMODELS}/<key>.3dshapes/<name>.step), cite (document, revision, page; maxima
# used), boxes (size [x, y, z] and at [x, y, z0], mm, footprint frame, +y down, z from the board).
# Frames: x and y as the footprint named in `land` lays out its pads.

version = 1

[[envelope]]
key = "murata"
name = "L_Murata_DFE252012F"
land = "a 2.5 x 2.0 mm two-terminal land, terminals along x"
cite = "Murata DFE252012F, J(E)TE243A-0017B-01 p. 5: 2.5 x 2.0 mm; height code F = 1.2 mm max"
boxes = [{ size = [2.5, 2.0, 1.2], at = [0.0, 0.0, 0.0] }]

