[[block]]
markdown = "# Blender assets requirements\n"

[[block]]
[[block.requirement]]
id = "BLIB-001"
text = "OpenDAP shall maintain its own Blender asset library, shared by every OpenDAP render."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "BLIB-002"
text = "Assets that belong to the OpenDAP project shall be CC-BY-SA-4.0; generic assets that enable others to innovate shall be CC-BY-4.0."
priority = "must"
status = "confirmed"

